<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タケダ造園 総合管理アプリ</title>
<style>
  body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
  .section { margin-bottom: 25px; border: 1px solid #ddd; padding: 15px; border-radius: 8px; }
  .title { font-weight: bold; color: #1a6b3c; font-size: 18px; margin-bottom: 10px; }
  .content { white-space: pre-wrap; font-size: 14px; }
</style>
</head>
<body>
    <h1>重要事項説明書 (Takezo Farm)</h1>
    <div id="app"></div>

<script>
window.onload = function() {
    // 1. データを取得
    const v8 = localStorage.getItem('juyo_v8');
    if (!v8) { document.getElementById('app').innerText = "データが見つかりません。"; return; }
    
    const fullData = JSON.parse(v8).data.construction; // 武田様の全37項目
    const app = document.getElementById('app');

    // 2. 項目を一つずつ画面に書き出す
    fullData.forEach((sec, idx) => {
        const div = document.createElement('div');
        div.className = 'section';
        div.innerHTML = `<div class="title">${idx + 1}. ${sec.label}</div>`;
        
        sec.content.forEach(c => {
            const p = document.createElement('p');
            p.className = 'content';
            p.innerText = c.text || c;
            div.appendChild(p);
        });
        app.appendChild(div);
    });
};
</script>
</body>
</html>
