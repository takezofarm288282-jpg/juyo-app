<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重要事項説明書</title>
<style>
:root{
  --g:   #1a6b3c;
  --gd:  #0f4526;
  --gl:  #e8f4ed;
  --gm:  #4caf72;
  --or:  #c0392b;
  --orl: #fff0ee;
  --t1:  #1a1a1a;
  --t2:  #444;
  --t3:  #888;
  --t4:  #ccc;
  --bg:  #f0f4f2;
  --wh:  #ffffff;
  --sh:  0 2px 10px rgba(0,0,0,0.09);
  --r:   10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:Meiryo,'Yu Gothic',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;font-size:14px;}

/* ヘッダー */
.hdr{background:var(--gd);color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,0.2);}
.hdr-title{font-size:15px;font-weight:700;letter-spacing:0.04em;}
.hdr-title span{color:#7ed8a0;}
.hdr-tabs{display:flex;gap:3px;}
.tb{padding:5px 12px;border:none;background:transparent;color:rgba(255,255,255,0.6);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border-radius:5px;transition:all .2s;}
.tb:hover{background:rgba(255,255,255,0.1);color:#fff;}
.tb.on{background:rgba(255,255,255,0.2);color:#fff;font-weight:700;}

/* 顧客入力バー */
.cust-bar{background:#fff;border-bottom:2px solid var(--gl);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.cust-bar label{font-size:12px;font-weight:700;color:var(--gd);white-space:nowrap;}
.cust-input{flex:1;min-width:160px;max-width:320px;border:1.5px solid var(--t4);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:14px;color:var(--t1);transition:border .15s;}
.cust-input:focus{border-color:var(--g);outline:none;}
.date-input{border:1.5px solid var(--t4);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--t1);transition:border .15s;background:#fff;}
.date-input:focus{border-color:var(--g);outline:none;}
.date-lbl{font-size:12px;color:var(--t3);white-space:nowrap;}

/* レイアウト */
.main{display:flex;height:calc(100vh - 56px - 45px);}

/* サイドバー */
.sb{width:240px;min-width:240px;background:#fff;border-right:1px solid #dde8e2;display:flex;flex-direction:column;overflow:hidden;}
.sb-hd{padding:10px 14px 8px;background:var(--gl);border-bottom:1px solid #dde8e2;}
.sb-hd h2{font-size:11px;font-weight:700;color:var(--gd);}
.sb-acts{display:flex;gap:5px;margin-top:7px;}
.sb-acts button{flex:1;padding:4px 0;font-size:11px;font-family:inherit;border:1px solid var(--g);border-radius:4px;cursor:pointer;font-weight:600;transition:all .15s;}
.btn-all{background:var(--g);color:#fff;}
.btn-all:hover{background:var(--gd);}
.btn-non{background:#fff;color:var(--g);}
.btn-non:hover{background:var(--gl);}
.cl{flex:1;overflow-y:auto;padding:4px 0;}
.ci{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;}
.ci:hover{background:var(--gl);}
.ci.on{border-left-color:var(--g);background:#f0faf4;}
.ci input[type=checkbox]{width:14px;height:14px;accent-color:var(--g);cursor:pointer;flex-shrink:0;}
.ci label{font-size:12px;color:var(--t2);cursor:pointer;flex:1;line-height:1.35;}
.ci.on label{color:var(--gd);font-weight:600;}

/* コンテンツ */
.cnt{flex:1;display:flex;flex-direction:column;overflow:hidden;}
.pv{flex:1;overflow-y:auto;padding:20px 24px;}
.dp{max-width:720px;margin:0 auto;}

/* プレビューカード */
.cov{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:24px 36px;margin-bottom:16px;border-top:5px solid var(--g);}
.cov-name{font-size:13px;font-weight:700;color:var(--g);margin-bottom:6px;}
.cov-ttl{font-size:18px;font-weight:700;color:var(--gd);text-align:center;letter-spacing:0.18em;margin-bottom:14px;}
.cov-txt{font-size:12px;line-height:1.9;color:var(--t2);border-left:3px solid var(--gm);padding-left:12px;}
.sc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;border:1px solid #dde8e2;}
.sh{background:var(--g);color:#fff;padding:9px 20px;font-size:12px;font-weight:700;}
.sb2{padding:14px 20px;}
.cr{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:12px;line-height:1.8;}
.cr:last-child{border-bottom:none;}
.cn{font-weight:700;color:var(--g);min-width:18px;flex-shrink:0;}
.ct{color:var(--t2);}
.cp{padding:5px 0;font-size:12px;line-height:1.8;color:var(--t2);border-bottom:1px solid #f5f5f5;}
.cp:last-child{border-bottom:none;}
.empty{text-align:center;padding:60px 0;color:var(--t3);}
.empty .ico{font-size:44px;margin-bottom:12px;}
.empty p{font-size:13px;line-height:2;}

/* 出力バー */
.ob{border-top:1px solid #dde8e2;background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;height:52px;}
.ob-info{flex:1;font-size:12px;color:var(--t3);}
.ob-info strong{color:var(--gd);}
.btn-pr{padding:8px 22px;background:var(--g);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(26,107,60,0.25);}
.btn-pr:hover{background:var(--gd);transform:translateY(-1px);}
.btn-pd{padding:8px 22px;background:var(--or);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(192,57,43,0.25);}
.btn-pd:hover{background:#922b21;transform:translateY(-1px);}

/* 編集パネル */
.ep{display:none;flex:1;flex-direction:column;overflow:hidden;}
.ep.on{display:flex;}
.et{background:#fff;border-bottom:1px solid #dde8e2;padding:9px 20px;display:flex;align-items:center;gap:8px;}
.et h2{font-size:13px;font-weight:700;color:var(--gd);flex:1;}
.btn-as{padding:6px 16px;background:var(--g);color:#fff;border:none;border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.btn-as:hover{background:var(--gd);}
.btn-sv{padding:6px 16px;background:#fff;color:var(--g);border:2px solid var(--g);border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.btn-sv:hover{background:var(--gl);}
.btn-bk{padding:6px 14px;background:#f5f5f5;color:var(--t2);border:1px solid var(--t4);border-radius:5px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}
.btn-bk:hover{background:#e8e8e8;}
.btn-cover-edit{padding:6px 14px;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-cover-edit:hover{background:#ffc107;color:#fff;}
.btn-reset{padding:6px 12px;background:#fff;color:#999;border:1px solid #ddd;border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;}
.btn-reset:hover{background:#fee;color:#c0392b;border-color:#c0392b;}
.move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}
.btn-move{width:24px;height:18px;border:1px solid var(--t4);background:#f5f5f5;border-radius:3px;cursor:pointer;font-size:9px;color:var(--t2);display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:all .15s;}
.btn-move:hover:not([disabled]){background:var(--g);color:#fff;border-color:var(--g);}
.btn-move[disabled]{opacity:0.3;cursor:default;}
.fixed-item{background:#f0faf4!important;}
.fixed-item label{color:var(--gd)!important;font-weight:600!important;}
.lock-icon{font-size:10px;opacity:0.6;}
.fixed-chk{font-size:15px;color:var(--g);flex-shrink:0;line-height:1;display:flex;align-items:center;}
.btn-fixed-edit{padding:6px 12px;background:#e8f0fe;color:#1a4a80;border:1px solid #a8c0f0;border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-fixed-edit:hover{background:#1a4a80;color:#fff;}
.fixed-tag{padding:5px 10px;background:#f5f5f5;color:var(--t2);border:1px solid var(--t4);border-radius:20px;font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;}
.fixed-tag:hover{border-color:var(--g);color:var(--g);}
.fixed-tag-on{background:var(--gl);color:var(--gd);border-color:var(--g);font-weight:700;}
.img-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding-top:12px;border-top:1px dashed #ddd;justify-content:center;}
.img-card{display:flex;flex-direction:column;align-items:center;gap:5px;}
.sec-img{max-width:180px;max-height:140px;object-fit:contain;border:1px solid #ddd;border-radius:5px;display:block;}
.sec-img:hover{opacity:0.9;}
.img-cap{font-size:11px;color:#555;text-align:center;max-width:180px;line-height:1.4;font-weight:500;}
.img-placeholder-pv{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f5f5f5;border:1px dashed #ccc;border-radius:5px;color:#aaa;font-size:20px;width:180px;height:120px;}
.img-edit-area{background:#f9f9f9;border:1px dashed #ccc;border-radius:6px;padding:12px;margin-top:8px;}
.img-edit-title{font-size:11px;font-weight:700;color:var(--gd);margin-bottom:10px;}
.img-empty-hint{font-size:11px;color:var(--t3);text-align:center;padding:12px 0;font-style:italic;}
.img-edit-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;padding:8px;background:#fff;border-radius:6px;border:1px solid #e8e8e8;box-shadow:0 1px 4px rgba(0,0,0,0.05);}
.img-thumb{width:90px;height:70px;object-fit:contain;border:1px solid #ddd;border-radius:4px;flex-shrink:0;background:#f5f5f5;}
.img-placeholder{display:flex;align-items:center;justify-content:center;font-size:24px;color:#ccc;background:#f5f5f5;}
.img-edit-right{flex:1;display:flex;flex-direction:column;gap:5px;}
.img-cap-input{width:100%;border:1px solid var(--t4);border-radius:4px;padding:6px 8px;font-family:inherit;font-size:12px;color:var(--t1);}
.img-cap-input:focus{border-color:var(--g);outline:none;}
.btn-del-img{padding:4px 10px;background:#fee;color:var(--or);border:1px solid #fcc;border-radius:4px;font-size:11px;cursor:pointer;font-family:inherit;transition:all .15s;}
.btn-del-img:hover{background:var(--or);color:#fff;}
.btn-replace-img{display:inline-block;padding:4px 10px;background:#f0f0f0;color:var(--t2);border:1px solid #ddd;border-radius:4px;font-size:11px;cursor:pointer;transition:all .15s;}
.btn-replace-img:hover{background:#e0e0e0;}
.btn-upload-img{display:inline-block;padding:8px 16px;background:var(--gl);color:var(--g);border:1.5px dashed var(--gm);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px;transition:all .15s;width:100%;text-align:center;}
.btn-upload-img:hover{background:var(--g);color:#fff;border-style:solid;}
.el{flex:1;overflow-y:auto;padding:14px 20px;}
.es{background:#fff;border-radius:var(--r);border:1px solid #dde8e2;margin-bottom:12px;overflow:hidden;}
.es:hover{box-shadow:var(--sh);}
.esh{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--gl);border-bottom:1px solid #dde8e2;}
.esh input{flex:1;border:1px solid transparent;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--gd);padding:3px 6px;border-radius:4px;transition:all .15s;}
.esh input:focus{border-color:var(--g);background:#fff;outline:none;}
.bi{width:26px;height:26px;border:none;border-radius:4px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s;flex-shrink:0;}
.bd{background:var(--orl);color:var(--or);}
.bd:hover{background:var(--or);color:#fff;}
.esb{padding:8px 12px;}
.er{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;padding:4px;border-radius:4px;background:#f5f5f5;}
.er textarea{flex:1;border:1px solid var(--t4);border-radius:4px;padding:5px 8px;font-family:inherit;font-size:11px;color:var(--t2);line-height:1.65;resize:vertical;min-height:48px;}
.er textarea:focus{border-color:var(--g);outline:none;}
.bdr{background:#fee;color:var(--or);border:none;}
.bdr:hover{background:var(--or);color:#fff;}
.btn-ar{width:100%;padding:5px;background:var(--gl);color:var(--g);border:1px dashed var(--gm);border-radius:4px;font-family:inherit;font-size:11px;cursor:pointer;margin-top:3px;transition:all .15s;}
.btn-ar:hover{background:var(--g);color:#fff;border-style:solid;}

/* トースト */
.toast{position:fixed;bottom:20px;right:20px;background:var(--gd);color:#fff;padding:10px 20px;border-radius:7px;font-size:13px;font-weight:500;box-shadow:0 4px 14px rgba(0,0,0,0.18);opacity:0;transform:translateY(6px);transition:all .3s;z-index:1000;pointer-events:none;}
.toast.on{opacity:1;transform:translateY(0);}

/* 印刷エリア */
#pa{display:none;background:#fff;padding:20px 28px;font-family:Meiryo,sans-serif;}

/* スマホ対応 */
@media(max-width:600px){
  .hdr{height:50px;}
  .hdr-title{font-size:13px;}
  .tb{padding:4px 8px;font-size:11px;}
  .cust-bar{padding:8px 12px;}
  .main{height:calc(100vh - 50px - 42px);}
  .sb{width:200px;min-width:200px;}
  .pv{padding:12px;}
  .cov{padding:16px 18px;}
  .cov-ttl{font-size:15px;letter-spacing:0.08em;}
  .ob{padding:8px 12px;gap:6px;}
  .btn-pr,.btn-pd{padding:7px 14px;font-size:12px;}
}
@media(max-width:420px){
  .sb{display:none;}
  .sb.open{display:flex;position:fixed;top:0;left:0;height:100vh;z-index:300;box-shadow:4px 0 20px rgba(0,0,0,0.2);}
  .menu-btn{display:flex!important;}
}
.menu-btn{display:none;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px;}
</style>
</head>
<body>
<div id="mainUI">
<div class="hdr">
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="menu-btn" id="menuBtn" onclick="toggleSB()">☰</button>
    <div class="hdr-title">タケダ造園 <span>重要事項説明書</span></div>
  </div>
  <div class="hdr-tabs">
    <button class="tb" id="tabS" onclick="switchDoc('service')">🌿 サッパリーズ</button>
    <button class="tb on" id="tabK" onclick="switchDoc('construction')">🏗 Takezo Farm</button>
    <button class="tb" id="tabE" onclick="switchMode('edit')" style="display:none;">✏️ 編集</button>
    <button class="tb" id="adminBtn" onclick="toggleAdminMode()">🔑</button>
  </div>
</div>

<!-- GitHub Token入力バー（管理者のみ表示） -->
<div id="tokenBar" style="display:none;background:#1a1a2e;padding:8px 16px;align-items:center;gap:10px;flex-wrap:wrap;">
  <span style="font-size:11px;color:#ffd700;font-weight:700;">🔑 GitHub Token：</span>
  <input id="tokenInput" type="password" placeholder="ghp_xxxxx..." style="flex:1;min-width:200px;max-width:360px;border:1px solid #444;border-radius:5px;padding:5px 10px;font-size:12px;background:#2a2a3e;color:#fff;">
  <button onclick="saveToken()" style="padding:5px 14px;background:#ffd700;color:#1a1a2e;border:none;border-radius:5px;font-size:12px;font-weight:700;cursor:pointer;">保存</button>

</div>

<div class="cust-bar">
  <label for="custName">お客様名：</label>
  <input class="cust-input" id="custName" type="text" placeholder="例：山田 太郎 様" oninput="renderPreview()">
  <label for="custDate" style="font-size:12px;font-weight:700;color:#0f4526;white-space:nowrap;">日付：</label>
  <input class="date-input" id="custDate" type="date" oninput="renderPreview()">
</div>

<div class="main">
  <div class="sb" id="sidebar">
    <div class="sb-hd">
      <h2 id="sbTitle">📋 項目チェック</h2>
      <div class="sb-acts">
        <button class="btn-all" onclick="checkAll()">全ON</button>
        <button class="btn-non" onclick="checkNone()">全OFF</button>
      </div>
    </div>
    <div class="cl" id="checklist"></div>
  </div>

  <div class="cnt">
    <div class="pv" id="previewArea">
      <div class="dp" id="docPreview"></div>
    </div>
    <div class="ep" id="editPanel">
      <div class="et">
        <h2 id="editTitle">✏️ 項目編集</h2>
        <button class="btn-bk" onclick="switchMode('preview')">← 戻る</button>
        <button class="btn-cover-edit" onclick="toggleCoverEdit()">📝 表紙編集</button>
        <button class="btn-fixed-edit" onclick="toggleFixedEdit()">🔒 固定設定</button>
        <button class="btn-as" onclick="addSection()">＋ 追加</button>
        <button class="btn-sv" onclick="saveAll()">💾 保存</button>
        <button class="btn-reset" onclick="resetAllData()" title="ブラウザの保存データをリセット">🔄 リセット</button>
      </div>
      <!-- 固定項目設定パネル -->
      <div id="fixedEditPanel" style="display:none;background:#f0f8ff;border-bottom:1px solid #b0d0f0;padding:14px 20px;">
        <div style="font-size:12px;font-weight:700;color:#1a4a80;margin-bottom:10px;">🔒 固定項目の設定（常にチェックされる項目）</div>
        <div id="fixedList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;"></div>
        <div style="font-size:11px;color:#888;">※ 🔒 がついている項目はチェックを外せません。クリックで固定のON/OFFを切り替えられます。</div>
      </div>
      <!-- 表紙編集パネル -->
      <div id="coverEditPanel" style="display:none;background:#fff8f0;border-bottom:1px solid #ffd580;padding:14px 20px;">
        <div style="font-size:12px;font-weight:700;color:#b07000;margin-bottom:10px;">📝 表紙の編集</div>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div>
            <label style="font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:4px;">タイトル</label>
            <input type="text" id="coverTitleInput" style="width:100%;border:1px solid #ddd;border-radius:5px;padding:7px 10px;font-family:inherit;font-size:13px;" oninput="updateCoverField('title',this.value)">
          </div>
          <div>
            <label style="font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:4px;">挨拶文</label>
            <textarea id="coverIntroInput" rows="4" style="width:100%;border:1px solid #ddd;border-radius:5px;padding:7px 10px;font-family:inherit;font-size:12px;resize:vertical;line-height:1.7;" oninput="updateCoverField('intro',this.value)"></textarea>
          </div>
          <div style="display:flex;gap:8px;">
            <button onclick="resetCover()" style="padding:5px 14px;background:#f5f5f5;color:#555;border:1px solid #ddd;border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer;">↩ 初期値に戻す</button>
          </div>
        </div>
      </div>
      <div class="el" id="editList"></div>
    </div>
    <div class="ob" id="outputBar">
      <div class="ob-info"><strong id="cntDisp">0</strong> 項目選択中</div>
      <button class="btn-pr" onclick="doPrint()">🖨 印刷</button>
      <button class="btn-pd" onclick="doPDF()">📄 PDF</button>
    </div>
  </div>
</div>
</div>

<div id="pa"></div>
<div class="toast" id="toast"></div>
<script>
var DEFAULT_COVERS = {
  service: {
    title: 'お　庭　管　理　重　要　事　項　説　明　書',
    intro: 'このたびは株式会社タケダ造園サッパリーズにご用命頂きまして、誠に有難うございます。お庭管理を行うにあたり、サービスの性質上、特に注意すべき点について予めお伝え致します。内容について十分にご理解の上、ご発注いただきますようお願い致します。'
  },
  construction: {
    title: 'お　庭　工　事　重　要　事　項　説　明　書',
    intro: 'このたびは株式会社タケダ造園、Takezo・ファーム、Takezo・和庭にご用命頂きまして、誠に有難うございます。お庭工事を行うにあたり、商品及び工事の性質上、特に注意すべき点についてお伝え致します。内容について十分にご理解の上、ご発注いただきますようお願い致します。'
  }
};
var COVERS = JSON.parse(JSON.stringify(DEFAULT_COVERS));
var DEFAULT_DATA = {"service": [{"label": "剪定", "content": [{"num": 1, "text": "剪定作業は庭木の樹形を整えることを目的として行いますが、庭木の枝を切除することから庭木の生長に対していくらかの影響を与えます。樹勢の衰退している庭木などは、場合によっては剪定後に枯死する可能性が無いとは言えません。しかし、枯死した場合でも補償したり、無償で処分をしたりなど、その責任を負うことは一切出来かねますことを予めご理解の上、ご発注いただきますようお願い致します。"}, {"num": 2, "text": "年間管理の剪定作業日は基本的に弊社で調整の上決定いたします。よって、庭木の花や実の時期に合わせた剪定にはお応えできない場合がございますことを予めご了承願います。なお、花や実をご希望の場合は予め打ち合わせの段階でご相談願います。"}, {"num": 3, "text": "作業範囲にハチの巣などの危険な状況を確認した場合は、一旦作業を中止して駆除専門会社への依頼をお願いする場合があります。その際にはご協力の程をお願いします。"}, {"num": 4, "text": "本サービスの剪定作業は、基本的に現状の大きさを整え維持することを前提とした剪定を行います。よって、大きさを変更したり形を変えるなどの剪定作業は別途となります。また、バラ、ウメ、フジなどについて、花芽を増やすことを目的とした場合は通常の剪定とは別に、特殊剪定が必要ですので、その旨をお伝えいただければ別途ご提案致します。"}, {"num": 5, "text": "花や実は個体差や環境変化によって左右されるため、花や実付きを考慮して剪定時期を適した季節にした場合であっても、必ずしも花や実付きの量を保証するものではございません。予めご了承ください。"}, {"num": 6, "text": "剪定後の清掃については、丁寧に作業を行いますが、雨の影響で葉がくっついたり、長年の堆積していたりなど、状況によっては葉等が残る場合がありますことを、ご理解願います。"}, {"num": 7, "text": "強剪定する場合の適期は新芽が出る時期である春頃となります。それ以外の時期に行うと、場合によっては、枝が枯れたり、樹勢が衰えたりする場合がございます。なお、強剪定は度合いにもよりますが、庭木に大きな負担がかかりますので、適期に行っても枝枯れや衰退(切り口からの腐朽等)は避けられないことを予めご了承下さい。特にクロマツを代表する針葉樹は強剪定を嫌いますので、強剪定をする場合は枯損覚悟にてご発注ください。"}, {"num": 8, "text": "強剪定や部分的に強く剪定した場合には、一時的に葉が薄くなったり、全くない状態となったりします。その際一定期間のおいて、庭木としての見栄えが落ちますことを予めご了承ください。"}, {"num": 9, "text": "作業内容によってはホコリ等が舞う場合がございます。よって、作業日には洗濯物等を取り込んでいただき、窓を閉じていただきますようお願いします。"}], "checked": false}, {"label": "害虫駆除薬剤散布", "content": [{"num": 1, "text": "薬剤散布時には、洗濯物の取り込み、窓閉めを必ず行っていただきますようお願いします。また、隣接している家へ薬剤が飛散する恐れがある場合には、ご挨拶の上作業を行いますが、予め散布作業の話を隣家にお声がけいただきますようお願いします。"}, {"num": 2, "text": "薬剤散布作業は雨や風などの天候に左右されるため、状況によっては急遽中止することがございます。"}, {"num": 3, "text": "薬剤が庭木以外（石、窓ガラス）に付着しないよう気をつけますが、万一付着した際には水で洗い流して落としますのでご安心ください。なお、予防のため予め水で濡らしてから散布するとこともございます。ただし、車への付着が予想される場合は作業ができませんので、予め動かしていただくか、シートなどで養生していただきますようお願いします。"}, {"num": 4, "text": "薬剤散布時に散布用機械を使用する場合がございます。その際に機械音が発生いたしますことを予めご了承ください。"}, {"num": 5, "text": "害虫の卵には薬剤が効かないため、薬剤散布後間もなく幼虫が発生する可能性があります。この場合薬剤散布ではそもそも解決できないので、作業不良ではありません。また、マツクイムシ防除薬剤散布等の防除用薬剤散布は、完全には防除できなことをご了承ください。"}, {"num": 6, "text": "幹に穴を開けて庭木を衰退させる総称テッポウムシについては、オプションとして予防薬剤塗布をご用意しておりますが、生きものであるが故に決して100%予防できるものではないことを予めご了承ください。"}, {"num": 7, "text": "果樹やハーブなど食することを目的に栽培されている庭木がある場合は、薬剤散布の対象から外しますので、事前にお知らせいただきますようお願いします。ただし、散布対象庭木の付近にある場合は、除外しても飛散する可能性があることをご了承ください。"}, {"num": 8, "text": "カイガラムシ駆除や殺菌などに使用する石灰硫黄合剤は、散布や塗布した後にしばらく対象庭木が白色になります。白色は雨により徐々に流れて戻りますが、数週間から数か月間に渡り白色が残る場合があります。また、薬剤散布直後は対象庭木周辺に不快な硫黄臭が致します。予めご了承のうえ、ご発注ください。"}, {"num": 9, "text": "薬剤散布は、樹木の生育状況や散布時の気象条件などの影響により、生理的障害を起こすことがあります。そのような障害を薬害といい、葉などの外観にマイナスの影響が現れます。薬害は一時的な現象であり、その後回復します。薬害の可能性を予め予測することは困難のため、薬害の可能性も含めてご発注いただきますようお願いします。"}], "checked": false}, {"label": "施肥", "content": [{"num": 1, "text": "地面に芝や苔などが植栽してある場合は、一度植栽を取り除き、施肥後に復旧しますので、その後乾燥するようであれば灌水作業を行っていただきますようお願いします。"}, {"num": 2, "text": "肥料には、有機肥料と無機肥料がございますが、最適な肥料を当社で選択をさせていただきます。"}, {"num": 3, "text": "有機肥料の施肥作業は、地面を掘って埋め戻しますので、地表が多少陥没したり凸凹することをご理解ください。"}, {"num": 3, "text": "防草シート等が敷設してある場合は、化成肥料もしくは液体肥料を使用いたします。"}], "checked": false}, {"label": "除草", "content": [{"num": 1, "text": "除草剤散布は基本的に葉に直接散布して根まで枯らせる性質の薬剤（浸透移行型）を使用致します。しかし、以下のような植物及び状態の場合は、一度の散布で完全に枯らすのは困難であるため完全に枯らす責任は負いかねますことを予めご了承ください。\n・雑草の種\n・トクサ\n・スギナなどの地下茎で繁茂する植物\n・球根類\n・竹、笹類"}, {"num": 2, "text": "除草剤散布について、庭木の根元付近への散布は庭木へ影響する可能性がありますので、散布できません。よって、庭木の根元付近は除草剤散布ができないことを予めご了解ください。"}, {"num": 3, "text": "浸透移行型除草剤の効果は、雑草の種類や環境によって違いが出ます（2～4週間程度）。よって、雑草が多種の場合は枯れるタイミングにずれが生じますが、これは散布のムラによるものではありません。また、浸透移行型の除草剤は種子には効かないため、散布後まもなく種子が発芽することを防げることはできません。"}, {"num": 4, "text": "機械での草刈り作業は、樹木の幹に傷がつく可能性があるため、幹の際での作業は出来かねます。"}, {"num": 5, "text": "機械での草刈り作業は、地表の小石を飛ばして危険です。よって、地表に小石等が敷いてある場合は、地表よりも高いところで刈ることで対処いたします。"}, {"num": 6, "text": "草刈り及び草抜き作業において、対象範囲に刈り抜きしてはならない庭木や草がある場合は、予め印付け等により明確に見分けがつくようにした上で、その旨をお伝えください。見分けがつかない場合は、刈り抜きの対象となりますので、ご注意ください。"}, {"num": 7, "text": "草刈り作業は、草の根が残るので、すぐに草が生えることをご理解ください。"}, {"num": 8, "text": "苔類は性質上、除草剤散布で枯らすことは難しいことをご理解ください。"}, {"num": 9, "text": "草抜きは、草の種類によっては根が残ります。また、小さな草（1㎝程度以下）は物理的に作業が困難となり草が残ります。その場合は合わせて除草剤散布作業もご検討ください。"}, {"num": 10, "text": "芝生への除草剤散布については、選択性除草剤により特定の雑草を駆除する方法があります。しかし、除草剤の種類はその都度変わるため、完全に薬剤を適合させることは困難です。また、スギナなど除草剤が聞き難い雑草がありますので、完全に駆除することはできません。その場合は、浸透移行性の除草剤を塗布することで、塗布した雑草を根まで枯らす方法が有効です。その際は、どうしても周辺の芝生が枯死しますことをご了承ください。"}], "checked": false}, {"label": "庭木伐採伐根撤去について", "content": [{"num": null, "text": "庭木伐採伐根撤去について"}, {"num": 1, "text": "庭木地上部の伐採は、地際での切断となりますが、作業上の理由により地際ギリギリでの切断はできません。小さい株で10㎝程度、大きい株だとそれ以上の高さでの切断となりますことをご了承願います。➡写①"}, {"num": 2, "text": "根株を残した伐採は、その後に根株が虫や菌類によって分解されます。場合によっては、白アリが発生する原因となります。よって、建物近くでは根株を抜根することをお勧めいたします。"}, {"num": 3, "text": "生きている庭木の根を残して伐採した場合、新しい芽が出てくる場合があります。伐採目的が枯死の場合は、新しく出てきた芽に対して除草剤を塗布してください。"}, {"num": 4, "text": "支柱の撤去は、引き抜きが困難な場合は地際で切断し、土中部分の杭は残置します。"}, {"num": 5, "text": "撤去する庭木の周囲に下草などがある場合、作業中にどうしても踏み荒らしてしまう可能性があります。重要な下草などがある場合は、あらかじめ移植するなどして、事前に避難していただきますようお願いいたします。"}], "checked": false}, {"label": "庭園清掃", "content": [{"num": 1, "text": "季節により、落葉量や雑草量が変動するため、作業範囲及び作業量はお約束できかねますことをご理解ください。"}, {"num": 2, "text": "作業時間の当日変更は出来かねます。予め変更する場合は、1日（6時間）単位で可能となります。"}, {"num": 3, "text": "作業人員数は、作業日ごとに弊社にて決定いたします。1日（6時間）の作業の場合、2人で作業すると3時間の作業時間となります。"}, {"num": 4, "text": "作業日は弊社で決定しご連絡差し上げます。ご希望日がございましても添えない場合がございますので、予めご了承ください。"}, {"num": 5, "text": "天候や職人の健康状態などにより、予定していた作業日を変更する場合がございます。"}, {"num": 6, "text": "雑草抜きの対象から外す草類等がある場合は、作業日当時に直接職人へ指示説明をお願いします。"}], "checked": false}, {"label": "作業中", "content": [{"num": 1, "text": "作業日時については、基本的に平日(月～金曜日)の午前８時～午後５時００分の間に作業致します。作業予定日については予め連絡をさせて頂きます。日によって作業開始時間と終了時間が様々ですが、開始時と終了時にご挨拶させていただきます。"}, {"num": 2, "text": "剪定、害虫駆除薬剤散布などのメンテナンス作業は外の環境や季節に非常に左右される作業です。よって作業日の変更などが生じることが多々ございます。天候によって急遽作業を中止する場合もありますので、予めご了承下さい。"}, {"num": 3, "text": "作業内容によっては、土ぼこりや薬剤の飛散が生じる場合があります。最善の注意を払って作業にあたりますが、飛散を完全に防ぐことは出来ません。よって、洗濯物の取り込み、窓閉めを必ず行っていただきますようお願いします。また、隣接している家へ薬剤が飛散する恐れがある場合には、当社からご挨拶の上作業を行いますが、可能であれば予め散布作業の話を隣家にしておいていただきますようお願いします。また、車などについても同様に移動またはカバーなど養生をして頂きますようお願いします。"}, {"num": 4, "text": "作業において、既存の建物など弊社の過失で万一損害を与えるようなことが生じた場合は、弊社の責任において補償いたします（場合によっては、損害保険を適用致します）。"}, {"num": 5, "text": "作業内容によっては音が発生する場合がございます(チェンソーや草刈り機、噴霧器などの作動音)音の発生が生活の弊害になる場合がありましたら、音が発する作業の時間を調整いたしますのでご相談下さい。"}, {"num": 6, "text": "作業中は、水道及び外部電気を無料で貸与願います。"}, {"num": 7, "text": "作業中は作業車輌用の駐車場（1～2台）が必要となります。必要な駐車場については、お客様にてご用意いただきますようお願いします。"}, {"num": 8, "text": "作業中に不意に作業員に近づくと非常に危険です。用が生じた場合は、遠くからお声がけいただきますようお願い致します。"}, {"num": 9, "text": "作業に伴って発生した廃棄物(剪定クズ)以外に関しては弊社では処分できませんので、一般廃棄物処理業の許可業者にご依頼ください。"}, {"num": 10, "text": "現場に伺う職人は、当日の作業に関する業務のみを担当しております。管理作業全体の計画やご契約内容につきましては把握しておらず、誤解を招く恐れがございます。そのため、作業計画や契約内容等に関するご質問・ご要望等は、必ず担当プランナーに直接お問い合わせください。なお、現場職人が工事計画や契約内容に関して申し上げた事項につきましては、当社としてその内容の正確性を保証するものではなく、一切の責任を負いかねます。ご不明点やご相談は必ず担当プランナーまでご確認いただきますようお願い申し上げます。"}], "checked": false}, {"label": "キャンセルポリシー", "content": [{"num": null, "text": "契約後についての契約解除は、契約内容別に以下の通り定めています。いずれも書面にて契約解除の意思表示が必要となります。予めご了承いただき、十分に検討の上ご契約いただきますようお願いします。"}, {"num": null, "text": "＜全作業が完了した年間作業契約の契約解除＞\n　年間作業契約の途中で、お客様のご都合により契約解除の意思表示がなされた場合は、以下の項目に該当する代金をご負担いただくことで、契約を解除できます。\n　・契約合計額の残額全てを支払う。"}, {"num": null, "text": "＜作業途中の年間作業契約の契約解除＞\n　年間作業契約の途中で、お客様のご都合により契約解除の意思表示がなされた場合は、以下の項目に該当する代金をご負担いただくことで、契約を解除できます。\n　・既に終えた作業について、1回限り作業に換算した合計金額を支払う。"}, {"num": null, "text": "＜作業前の1回限り作業契約の契約解除＞\n　1回限り作業契約の作業前に、お客様のご都合により契約解除の意思表示がなされた場合は、以下の項目に該当する代金をご負担いただくことで、契約を解除できます。\n　・すでに仕入れている資材や設備の代金\n　・すでに手配している作業員等の費用\n　・契約締結までに要した打合せや設計の実費や人件費"}, {"num": null, "text": "＜作業途中の1回限り作業契約の契約解除＞\n　1回限り作業契約の作業途中に、お客様のご都合におり契約解除の意思表示がなされた場合は、以下の項目に該当する代金をご負担いただくことで、契約を解除できます。\n　・すでに仕入れている資材や設備の代金\n　・すでに手配している作業員等の費用"}], "checked": false}, {"label": "契約にあたり", "content": [{"num": 1, "text": "分割払いは税別6万円以上のご契約の場合に可能となります。よって、契約金額が税別6万円未満の場合は、一括払いの取り扱いとなりますことをご了承ください。"}, {"num": 2, "text": "お支払方法としましては、以下の通りお願いいたします。\n＜年間作業契約＞口座引き落し\n＜１回限り作業＞口座引き落し　もしくは　指定口座への振り込み\n※安全確保と利便性向上の一環として、現金での集金は行っておりません。ご理解とご協力をお願い申し上げます。"}, {"num": 3, "text": "作業中に、作業内容の確認など、必要に応じて現地立ち合い確認をお願いすることがあります。しかし、お客様から当初のご契約いただいた内容を変更することは、基本的に出来ませんので、十分に確認していただいた上でのご契約をお願いします。なお、どうしても変更が必要な場合は、作業内容が変わることで生じた作業追加料金が発生いたします。逆に作業量が少なくなっても減額はできかねますことを予めご了承ください。"}], "checked": false}], "construction": [{"label": "フェンス・ブロック塀", "content": [{"num": null, "text": "フェンス（境界・目隠し） 境界ブロック塀"}, {"num": 1, "text": "境界フェンスは隣地境界を目的に設置するものです。外部から圧力がかかるような使用方法（手すり・転落防止柵・布団干し・ボール当て・登り場・木の支柱など）はしないでください。"}, {"num": 2, "text": "フェンス上に雨具・洗濯物・布団などを載せたり被せたりしないでください。"}, {"num": 3, "text": "アルミ色がブラック・ダークブロンズなど色の濃い種類の場合、移動中や施工中の僅かな摩擦によっての擦り傷が目立ち易くなります。万一目立つ場合は近似色のタッチペンで部分塗装いたしますので、予めご了承ください。"}, {"num": 4, "text": "隣地との境界線に施工される場合は、境界杭と境界線の確認をお隣様と行ってください。不明な場合は、土地を取得された時の、不動産業者や住宅建築会社に問い合わせ下さい（当社での確認は致しておりません。なお、問合せ先が不明な場合は、当社にご相談下さい）。➡写①"}, {"num": 5, "text": "境界線のフェンス・ブロック工事は、一度お隣様側の土地を２０㎝程度掘らせて頂き、フェンス完成しだい綺麗に戻します。また、工事の際お隣様の土地に入ることになります。この点について必ずお隣様にお伝えいただき、許可をもらわれますようお願いします。なお、当社の立ち会いをご希望される場合は、その旨お伝え下さい。"}, {"num": 6, "text": "樹脂フェンスは、性質上横板に圧力を加えると曲がります。また、風により横板が震えたり、音がすることがありますことを予めご了承ください。"}, {"num": 7, "text": "普通コンクリートブロック（CB）は化粧のないブロックであるため、コンクリート材料の色や模様がそのまま表面に出てきます。よって、製造ロットや製造環境の違いによって個々の色を統一することができません。場合によっては施工後に色違いが目立つ場合がありますので、このことを予めご了承いただいた上にご発注ください。"}], "checked": false}, {"label": "植栽①", "content": [{"num": 1, "text": "植栽の適期は樹種によって以下の通りとなります。適期を逸した場合は、枯損率が高くなります。適期以外の植栽は保証の対象外となりますことをご了承ください。\n・常緑樹： 3月～6月   　・落葉樹：11月～4月　   ・針葉樹：12月～3月"}, {"num": 2, "text": "高中低木については、植栽後6か月間で根の伸長が見られず、このことが原因で枯死に至った場合には同等品にて植替え致します（移植は除く）。ただし、適切な灌水管理をされていることが前提となります。なお、特殊樹形や特殊品目など同等品での植替えが困難な場合には、樹種変更や樹形変更により対応させていただきます。\n※枯死とは、幹が1本の樹木（単幹）については、樹高（プラン上）の40％以上枯込んだ場合を、幹が3本以上の樹木（株立）については、樹高（プラン上）の40％以上枯込んだ幹以外が2本以下になった場合をいいます。"}, {"num": 3, "text": "植栽後に灌水作業が本工事とは別途に必要です。目安として春（3～5月）2～3回／週、夏（6～8月）3～4回／週、秋（9～11月）1～2回／週、冬（12～2月）0～1回／週、1回当たり20㍑／本または10㍑／㎡を基本としてお願いします。"}, {"num": 4, "text": "草花や地被植物及び芝生については、灌水不足が枯死の原因となりますので、保証対象外となりますことを予めご了承ください。"}, {"num": 5, "text": "植栽（移植は除く）した環境（風・光・土壌）が合わないことが原因で植栽後1年以内に枯死した場合は、同等品にて植替えます。ただし、お客様のご要望で樹種を指定された場合は保証対象となりません。"}, {"num": 6, "text": "植栽後に病害虫が発生することがあります。病害虫の駆除費用は見積書に記載がある場合を除いて工事金額には含まれておりません。また、環境によっては、蜂などの有害昆虫や鳥類などの野生動物が植物に集まることがありますが、その際の責任は負いかねますことを予めご了承ください。"}, {"num": 7, "text": "シロアリが原因で枯死した場合は保証致しかねます。シロアリの発生が疑われる場合は、シロアリ駆除専門会社に有無の判断をご依頼ください。"}, {"num": 8, "text": "風対策として支柱を設置する場合があります。支柱は目安として植栽2年後以降は必要なくなります。その場合はお客様にて撤去、もしくは弊社へご相談ください。"}, {"num": 9, "text": "芝生は、植栽後の梅雨期にキノコが発生する場合があります。これは、土中に鋤き込んだ有機物が分解される過程で起こる正常な働きです。キノコが発生した際には殺菌剤を散布しますので、ご連絡いただきますようお願いします。なお、植栽2年目以降の発生は、刈芝の残材が原因ですので、の場合はお客様にて芝生のお手入れをお願いします（芝生管理説明書参照）。➡写①"}, {"num": 10, "text": "下草（タマリュウ）について、植込み密度によって仕上がりが異なります。密度は100%、50%、20%があります。予め仕上がりの密度を確認ください。➡②"}, {"num": 11, "text": "花や実の量は生育環境により左右されますので、花や実の量はお約束出来ません。"}, {"num": 12, "text": "花色は土壌環境等により変化しますので、色合いをお約束することは出来ません。"}, {"num": 13, "text": "下草は植栽時に今後生長する空間を考慮して一定の間隔を確保します。よって、施工例や雑誌などのように密集した状態になるには植栽後１～2年必要です。➡写③"}], "checked": false}, {"label": "植栽②", "content": [{"num": 1, "text": "植栽する木は、基本的に生産地で育てた生産品です。よって、長い年月をかけて剪定など管理を重ねた結果、幹が太って枝葉の密度が濃くなった庭木とは違い、植栽時は幹が細くて枝葉の密度は薄い木となります。年数をかけて仕立てが庭木をご希望の際には、必ずその旨をご契約前にお知らせください。改めて在庫確認と御見積をいたします。\n➡写①"}], "checked": false}, {"label": "移植", "content": [{"num": 1, "text": "移植は、植栽保証の対象外となりますので、予めご了承下さい。"}, {"num": 2, "text": "移植の適期は樹種によって以下の通りとなります。適期を逸した場合は、枯損率が高くなります。\n・常緑樹： 3月～6月   　・落葉樹：11月～4月　   ・針葉樹：12月～3月"}, {"num": 3, "text": "移植後に灌水作業が本工事とは別途に必要です。目安として春（3～5月）2～3回／週、夏（6～8月）3～4回／週、秋（9～11月）1～2回／週、冬（12～2月）0～1回／週、1回当たり20㍑／本または10㍑／㎡を基本としてお願いします。"}, {"num": 4, "text": "風対策として支柱を設置する場合があります。支柱は目安として移植2年後以降は必要なくなります。その場合はお客様にて撤去、もしくは弊社へご相談ください。"}, {"num": 5, "text": "移植後に病害虫が発生することがあります。病害虫の駆除費用は見積書に記載がある場合を除いて工事金額には含まれておりません。また、環境によっては、蜂などの有害昆虫や鳥類などの野生動物が植物に集まることがありますが、その際の責任は負いかねますことを予めご了承ください。"}, {"num": 6, "text": "花や実の量は生育環境により左右されますので、花や実の量はお約束出来ません。"}, {"num": 7, "text": "花色は土壌環境等により変化しますので、色合いをお約束することは出来ません。"}], "checked": false}, {"label": "樹勢回復", "content": [{"num": 1, "text": "樹木樹勢診察は、診察のみを行います。よって、樹勢回復のための治療行為は別途となります。"}, {"num": 2, "text": "樹木治癒（樹勢回復）においては精一杯の処置を行いますが、樹勢回復を約束することは出来ません。予めご理解の上でご発注ください。"}, {"num": 3, "text": "樹木治療には、治療後の管理作業は含まれておりません。しかし、治療後の適切な管理作業によって回復状況が左右されます。よって、治療後の管理作業を欠かさないようお願いします。なお、管理作業について別途ご提案は可能ですので、ご相談ください。"}, {"num": 4, "text": "樹木治療は、樹木にとって最も適した時期に施術します。よって、すぐに治療に取り掛かれない場合もありますことをご理解ください。"}, {"num": 5, "text": "風対策として支柱を設置する場合があります。支柱は通常ならば目安として移植2年後以降は必要なくなりますが、治療の場合は長期必要となる場合があります。よって、支柱撤去を要する場合や支柱が破損した場合は、弊社へご相談ください。"}, {"num": 6, "text": "樹木治療は一度の施術で回復するとは限らず、むしろ長期に継続した治療を必要とする場合が多くあります。"}], "checked": false}, {"label": "アウトレット庭木", "content": [{"num": 1, "text": "アウトレット庭木の対象庭木は、庭木リサイクルによって引き取った庭木を安価にてご提供するサービスです。よって傷があったり特徴的な樹形であったりなど、産地で生産している庭木とは違いますので、あらかじめ現物をご確認いただきますことをおすすめいたします。"}, {"num": 2, "text": "高中低木については植栽後6か月間で根の伸長が見られず、このことが原因で枯死に至った場合には保証の対象となります。ただし、適切な灌水管理をされていることが前提となりますので、予めご了承ください。また、庭木アウトレットは特別に安価にて、提供しています。よって、保証時にはふた回り小さいサイズの植え替えとなりますことを予めご了承ください。（例：高さ3ｍ→2ｍ）なお、特殊樹形や特殊品目など同樹種での植替えが困難な場合には、樹種変更や樹形変更により対応させていただきます。※枯死とは、幹が1本の樹木（単幹）については、樹高（プラン上）の40％以上枯込んだ場合を、幹が3本以上の樹木（株立）については、樹高（プラン上）の40％以上枯込んだ幹以外が2本以下になった場合をいいます。"}, {"num": 3, "text": "植栽後に灌水作業が本工事とは別途に必要です。目安として春（3～5月）2～3回／週、夏（6～8月）3～4回／週、秋（9～11月）1～2回／週、冬（12～2月）0～1回／週、1回当たり20㍑／本または10㍑／㎡を基本としてお願いします。"}, {"num": 4, "text": "植栽（移植は除く）した環境（風・光・土壌）が合わないことが原因で植栽後1年以内に枯死した場合は、同等品にて植替えます。ただし、お客様のご要望で樹種を指定された場合は保証対象となりません。"}, {"num": 5, "text": "花や実の量は生育環境により左右されますので、花や実の量はお約束出来ません。"}, {"num": 6, "text": "花色は土壌環境等により変化しますので、色合いをお約束することは出来ません。"}, {"num": 7, "text": "植栽後に病害虫が発生することがあります。病害虫の駆除費用は見積書に記載がある場合を除いて工事金額には含まれておりません。また、環境によっては、蜂などの有害昆虫や鳥類などの野生動物が植物に集まることがありますが、その際の責任は負いかねますことを予めご了承ください。"}], "checked": false}, {"label": "アウトレット製品", "content": [{"num": 1, "text": "アウトレット製品は、訳ありや数量過多などの理由により、通常よりも安いアウトレット価格でご提供する製品であり、使用品質上問題ありません。アウトレット製品は、通常製品同様の保証及びキャンセルポリシーが適用されます。ただし、アウトレット理由に対する返品等は出来かねますので、購入前に充分に確認ください。"}, {"num": 2, "text": "アウトレット製品についての取り扱いについては、該当の重要事項説明書をご確認ください。"}, {"num": 3, "text": "アウトレット製品は、通常製品と比較した場合、色や材質などに違いがある場合があります。特に混合して使用する際にはその差が顕著になる可能性があります。このことを予めご了承のうえ購入ください。"}, {"num": 4, "text": "アウトレット製品は、数量に制限があるため、追加工事などにより数量が増えた場合には、在庫切れによりご提供できない場合があります。"}, {"num": 5, "text": "ご契約後、弊社の責任において、アウトレット製品が不足した場合は、新品もしくは代替品にて補充いたします。しかし、お客様のご都合でアウトレット製品が不足した場合は、新品もしくは代替品を新たにご購入いただきますことを予めご了承管ください。"}], "checked": false}, {"label": "洗い出し", "content": [{"num": null, "text": "洗い出しコンクリート"}, {"num": 1, "text": "洗い出しコンクリート工事（種石用）は、外環境や種石に左右されることが多いため、必ずしもカタログや見本通りに仕上がるとは限りません。多少の色の違いや隙間の違いが出ますことを予めご了承ください。➡写①"}, {"num": 2, "text": "洗い出しコンクリート工事（種石無）は、コンクリートを打設した表面を洗うことで、砕石などのコンクリート骨材を表面に見えるようにした仕上げ方法です。このコンクリート骨材は生コンクリート製造の過程で混入されるため、種類や色の指定が出来ません。よって、仕上がりの色合いについては現場によって違いますことをご了承ください。➡写②"}, {"num": 3, "text": "洗い出しコンクリート工事は、製品の性質上、ご使用中に種石や砕石が外れることがありますことを予めご了承ください。"}, {"num": 4, "text": "製品によっては表面が濡れている場合、滑りやすくなることがあります。転倒などによる怪我については責任を負いかねますので、予めご理解のうえでご注文願います。"}], "checked": false}, {"label": "コンクリ・レンガ・タイル製品①", "content": [{"num": null, "text": "コンクリート製品・レンガ製品・タイル製品１⃣"}, {"num": 1, "text": "コンクリート・レンガ・タイル製品は、性質上、白華現象（表面が白く粉がつくこと）が生じやすい製品です。白華現象が生じた場合でも、製品の強度には影響はありません。白華現象は避けることのできない化学作用ため、入れ替えなどの保証は致しかねます。なお、発生時除去方法としては、サンポールなどの酸性洗剤で落とすことができますが、性質上完全な除去は困難です。万一発生した場合あ、現地にて出来るだけの除去作業を1度だけ行いますが、完全に除去することを保証できません。このことを十分にご理解した上でご契約ください。➡写①"}, {"num": 2, "text": "外構工事は現場にて手作りで仕上げる部分が多くあります。よって、機械等で精密に作る製品とは違い、形状に誤差が生じたり、隙間などが生じる場合がございますことを予めご了承ください。"}, {"num": 3, "text": "色付き製品については、時間とともに色があせることがあります。予めご了承ください。➡②"}, {"num": 4, "text": "製品によっては、濡れた時と乾いた時の色が異なる場合があります。予めご了承ください。"}, {"num": 5, "text": "施工場所によっては、製品目地や製品の表面に苔などの汚れが生じる場合があります。予めご了承ください。➡③"}, {"num": 6, "text": "製品によっては、目地から草が生えることがあります。予めご了承ください。"}, {"num": 7, "text": "製品によっては表面が濡れている場合、滑りやすくなることがあります。転倒などによる怪我については責任を負いかねますので、予めご理解の上注文願います。"}, {"num": 8, "text": "インターロッキング製品は、目地に細砂を入れることによって固定します（ただし、完全には目地は埋まりません）。よって、敷設完了直後はインターロッキング・レンガの表面に砂が薄くのった状態となります。➡写④"}, {"num": 9, "text": "製品上に車が載る場合は、予め対応できるコンクリート土間を下地に打設する必要があります。よって、車が載る可能性の有無についてご契約前の段階で、予めご相談ください。また、図面に車道用の記載がない場合は、車が載る仕様になっていません。予めご確認ください。"}], "checked": false}, {"label": "コンクリ・レンガ・タイル製品②", "content": [{"num": null, "text": "コンクリート製品・レンガ製品・タイル製品２⃣"}, {"num": 1, "text": "インターロッキングやレンガ製品は、工場で製造し現地へ運搬しています。その生産及び運搬の過程において、どうしても欠けや汚れが生じます。また、基本的に屋外での使用を前提とした製品であるため、過剰な梱包や細部への精密さにコストをかけておりません。よって、わずかな傷や欠けを無くし、細部まで完全な状態にてお届けすることはできません。このことを十分にご理解の上ご契約ください。なお、使用上支障が生じるもしくは、見た目を著しく低下させる破損や傷については取り換えの対象となります。この場合の基準としては以下の通りです。\n・表面に断片５㎝以上の欠け、破損が認められる場合\n・幅３㎜以上のひび割れが認められる場合"}, {"num": 2, "text": "コンクリート製品には、石や小石をコンクリートに貼り付けて意匠性を高めた製品があります。このような製品は、貼り付けてある石や小石が剥がれ落ちることがあります。特に小さな小石が貼り付けている場合は、製品性質上剥がれ落ちることを前提としていますので、このことをご了承の上、製品を選定ください。ただし、剥がれ落ちる度合いが製品使用上支障をきたす場合や、見た目を著しく低下させる場合は取り換えいたします。この場合の基準としては以下の通りです。\n・貼り付けた石が３cm以上の場合、１枚あたり５個以上剥がれ落ちた場合\n・貼り付けた石が３㎝以下の場合、下地のコンクリートが１割以上あらわになっている場合"}, {"num": 3, "text": "インターロッキングやレンガ製品の色については、工場生産のロットによって多少変動します。よって、見本やカタログでの色は参考程度としてご検討いただき、全く同様の色の製品が届くことはお約束できませんので、予めご了承いただいた場合のみご契約ください。このことは、製品１つ１つの間の色差、１つの製品においての色ムラについても同様に生じます。"}], "checked": false}, {"label": "カーポート/サイクルポート/テラス屋根", "content": [{"num": null, "text": "カーポート/サイクルポート/テラス屋根"}, {"num": 1, "text": "積雪許容範囲以上の雪が積もる場合は、必ず雪おろしをしてください。積雪許容範囲を超えて破損した場合は、保証致しかねます。\n積雪許容範囲（20㎝・30㎝・50㎝・100㎝・150㎝・200㎝）"}, {"num": 2, "text": "風の向きによっては雨が入ることがあります。予めご了承ください。"}, {"num": 3, "text": "片側支持タイプのカーポートを設置する場合、強風時への対策としてサポートセット＋パネル抜け防止材を追加されますことをお勧めします。"}, {"num": 4, "text": "アルミ色がブラック・ダークブロンズなど色の濃い種類の場合、移動中や施工中の僅かな摩擦によっての擦り傷が目立ち易くなります。万一目立つ場合は近似色のタッチペンで部分塗装いたしますので、予めご了承ください。"}, {"num": 5, "text": "屋根材に使用されるポリカーボネートやアクリル板などの素材は、その性質上、設置作業時に指紋などの汚れがどうしても付きます。細心の注意を払って作業をいたしますが、これを完全に無くすことはできませんので、予めご了承の上ご契約ください。"}, {"num": 6, "text": "地域や場所によっては非常に風が強い場合があります。メーカーカタログに記載の耐風圧強度を参考に、強風に対してワンランク上の商品を選択されることをお勧めいたします。なお、地域別の風速については、別紙風配図を参照ください。"}, {"num": 7, "text": "カーポートの屋根の高さは、下地勾配の関係により一律ではありません。施工中施工後に屋根の高さを変更することは出来ませんので、必ずハッチを開いた時に屋根と接触しない事を予め実測にて確認した上でご契約ください。➡図1"}, {"num": 8, "text": "別頁「建築確認申請および登記に関する合意事項」内容をご確認の上、ご了承ください。"}], "checked": false}, {"label": "囲い商品", "content": [{"num": null, "text": "囲い商品・屋根商品（ストックヤード、ガーデンルームなど）"}, {"num": 1, "text": "囲い商品・屋根商品は、基本的に気密性を要しない商品であり、断熱効果などは期待できません。また強風時には雨漏りすることもあります。"}, {"num": 2, "text": "建物と商品との隙間はコーキングにより塞いでいますが、壁の形状や材質によっては雨水が漏ることがあります。その場合は、雨漏り部分のコーキングの補強は可能ですが、製品の性質上、完全に雨漏りを防ぐことはできないことを予めご了承下さい。"}, {"num": 3, "text": "テラスやストックヤードなどの屋根製品は、材質上雨天時に雨粒の衝突音が発生いたします。また、風によっても音が発生する場合があることを予めご了承ください。"}, {"num": 4, "text": "設置する製品の屋根と隣地境界との距離について、団地によっては決め事等がございます。その際には、決め事等に対する責任を弊社では負えませんので、お客様にて必ず確認いただきますようお願いします。"}, {"num": 5, "text": "アルミ色がブラック・ダークブロンズなど色の濃い種類の場合、移動中や施工中の僅かな摩擦によっての擦り傷が目立ち易くなります。万一目立つ場合は近似色のタッチペンで部分塗装いたしますので、予めご了承ください。"}, {"num": 6, "text": "屋根材に使用されるポリカーボネートやアクリル板などの素材は、その性質上、設置作業時に指紋などの汚れがどうしても付きます。細心の注意を払って作業をいたしますが、これを完全に無くすことはできませんので、予めご了承の上ご契約ください。"}, {"num": 7, "text": "ドアにドアストッパーを設置した場合、設置当初は動きが固くなりますが、時間経過とともに開閉し易くなります。➡写①"}, {"num": 8, "text": "住宅外壁の構造は建築会社によって異なります。元々外壁内に侵入した雨水を水切り部分で外へ排出する構造になっている場合もあります。その場合は、外壁内の雨水が商品内への浸入してきますので、予め建築会社にご確認の上、ご発注頂きますことをお勧めいたします。"}, {"num": 9, "text": "別頁「建築確認申請および登記に関する合意事項」内容をご確認の上、ご了承ください。"}], "checked": false}, {"label": "樹脂デッキ", "content": [{"num": 1, "text": "水濡れにより、デッキ表面に汚れやシミなどが残る場合があります。また、表面張力や桁の構造上、雨水が床板上に5mm程度溜まりますことを予めご了承下さい。➡写①"}, {"num": 2, "text": "外的要因により付着した汚れやシミにより、黒い斑点（かびなど）が発生します。定期的に汚れを落とすことで、黒い斑点（かびなど）の発生を減らすことが出来ます。 汚れを落とす場合は、洗車ブラシやデッキブラシを使い、板材の長手方向に向かっておすってください。この時に、板材をたっぷりと水で濡らしてから、中性洗剤を希釈した洗剤を付けてこすります。"}, {"num": 3, "text": "人工木には木粉が含まれているため、天然木同様、雨水によるアクの染み出しが周辺に付着する場合があります。➡写②"}, {"num": 4, "text": "デッキの上では、履物をはいて利用してください。日中、日差しが強い時はデッキが高温になっているため、裸足で歩いたり、乳児を一人で遊ばせると、やけどをするおそれがあります。"}, {"num": 5, "text": "雨などで濡れたデッキ、ステップはすべりやすくなっているため、転倒するおそれがありますので注意してください。"}, {"num": 6, "text": "破損防止のため、制限荷重180kg/㎡（目安として積雪60㎝）以上の重さをかけないで下さい。"}, {"num": 7, "text": "プランターなどを床板に載せる場合、床板1枚に常時（長時間）かかる重量は15kg以下にして下さい。床板の下に補強材を取り付けた場合でも、床板1枚に常時かかる重量は40kg以下にして下さい。重量を長時間載せたままにしますと、床板が曲がるおそれがあります。"}, {"num": 8, "text": "製品性質上、日当たりや気温によって、必ずわずかに伸び縮みします。よって、板と板の隙間は環境状況によって数ミリ程度変化します。"}, {"num": 9, "text": "製品は可燃性です。燃料タンクなどの危険物および熱風などの排気口の近くには設置できません。また、製品の上やその付近で、バーベキュー・ガスコンロなど、高温になるものを使用しないでください。火を燃やしたり加熱したりすると、製品が燃えたり変形したりします。"}], "checked": false}, {"label": "樹脂フェンス", "content": [{"num": 1, "text": "雨や水濡れにより、フェンス表面に汚れやシミなどが残る場合があります。➡写①"}, {"num": 2, "text": "外的要因により付着した汚れやシミにより、黒い斑点（かびなど）が発生します。定期的に汚れを落とすことで、黒い斑点（かびなど）の発生を減らすことが出来ます。 汚れを落とす場合は、洗車ブラシやデッキブラシを使い、板材の長手方向に向かってこすってください。この時に、板材をたっぷりと水で濡らしてから、中性洗剤を希釈した洗剤を付けてこすります。"}, {"num": 3, "text": "製品は可燃性です。燃料タンクなどの危険物および熱風などの排気口の近くには設置できません。また、製品の上やその付近で、バーベキュー・ガスコンロなど、高温になるものを使用しないでください。火を燃やしたり加熱したりすると、製品が燃えたり変形したりします。"}, {"num": 4, "text": "製品性質上、日当たりや気温によって、必ずわずかに伸び縮みします。よって、板と板の隙間は環境状況によって数ミリ程度変化します。"}, {"num": 5, "text": "樹脂フェンスによっては、柱の天端及び板の端部に専用のキャップを取り付ける場合があります。キャップはボンドにて取り付けてありますが、温度や湿度など外部環境の変化によって外れることがあります。その場合は、市販のボンドにて接着ください。なお、キャップのみの購入も可能です。➡写②"}], "checked": false}, {"label": "材質", "content": [{"num": 1, "text": "真ちゅう、青銅、黄銅製品は、製品表面の仕上げ、使用される場所の環境、気象条件などによって異なりますが、時間とともに変色、緑青の発生がおこります。➡写①"}, {"num": 2, "text": "器などの焼き物製品は色ムラ、質感の違い、貫入（表面の細かなヒビ）、凹凸などがあります。➡写②"}, {"num": 3, "text": "天然木材は、腐りや色あせ、反り、割れが生じますことを、予めご了承くだい。また、雨などにより濡れた際に地面へ茶色の雫が落ち床を汚すことがありますので床の色や材質に配慮が必要です。➡写③"}, {"num": 4, "text": "古枕木は、腐り、色あせが生じます。また、場合によってはシロアリが発生する場合もありますので予めご了承ください。"}, {"num": 5, "text": "樹脂製品は、紫外線による色あせが生じますことを予めご了承ください。"}, {"num": 6, "text": "アルミ製品に取り付けられている樹脂製のキャップ等は、太陽光劣化により年数とともに色あせます➡写④"}, {"num": 7, "text": "砕石は、自然の山である採石場から採掘した岩を砕いて生産しています。よって、採石場の岩盤層の状況により採掘した岩の色及び粒径が多少変化します。そのため、砕石は均一の色を保証することは出来かねます。同様に砕石見本は、見本が採掘された時点での砕石ですので、あくまでもイメージの参考として確認ください。以上より、砕石の色の変更等はできませんので、予めご了承ください。➡写⑤"}, {"num": 8, "text": "ステンレス、アルミなど金属が使用されているすべての商品・部品類は、塩害（潮風に含まれる塩分による被害・酸性雨・排気ガス・新築完成後の洗浄剤・その他の要因により、まれに「もらい錆」が発生しやすくなりますので、天候回復次第、速やかにお手入れしてください。なお、普段のお手入れは、湿らせた布でお拭きください。汚れがひどい場合は、中性洗剤をご使用ください。シンナー等のご使用は、絶対にお止めください。➡写⑥"}], "checked": false}, {"label": "水栓・灌水タイマー", "content": [{"num": 1, "text": "凍結により、タップや配管が破損した場合は、有償修理となります。"}, {"num": 2, "text": "電池式灌水タイマーは、年1回の電池交換が必要です。予めご了承ください。また、凍結や機械故障にて、水が止まらなくなる可能性があります。その場合、水道料金の保障は出来かねますので、定期的に点検して頂きますようお願いします。"}, {"num": 3, "text": "電源灌水タイマーは、故障等により水が止まらなくなる可能性は非常に低い商品です。しかし、万一何らかの原因で水が止まらない場合に水道料金の保障等は出来かねますので、定期的に点検をお願いします。"}], "checked": false}, {"label": "人工芝", "content": [{"num": 1, "text": "人工芝の上に土が入ると草が生えます。人工芝の近くで土作業をされる場合は、土が入らないように養生シートを敷くなどの対策をしてください。"}, {"num": 2, "text": "人工芝の端部から草が生えてくることがあります。予めご了承ください。➡写①"}, {"num": 3, "text": "ＢＢＱなどの際、熱された炭が落下すると、その部分の人工芝は溶けますのでご注意ください。"}, {"num": 4, "text": "人工芝は製品性質上、使用すると踏圧により葉が倒れます。予めご了承ください。"}, {"num": 5, "text": "人工芝は車が載ることを想定していません。よって、車の乗り入れは出来ないことを予めご了承ください。"}, {"num": 6, "text": "人工芝は施工上、継ぎ目が生じます。継ぎ目は隠すことができませんので、予めご了承ください。➡写②"}, {"num": 7, "text": "人工芝の表面が濡れている場合は、滑りやすくなっていますのでご注意ください。"}, {"num": 8, "text": "人工芝は紫外線により色あせることがありますので、予めご了承ください。"}, {"num": 9, "text": "人工芝は、気温の変化によって伸縮するため、隙間や反りが発生する場合があります。"}, {"num": 10, "text": "人工芝はロール状態での運搬になります。よって、敷設した時には葉が寝ています。そのため色味が違って見えることがありますが、時間と共に葉が起きて同色に揃いますので、予めご了承下さい。➡写②"}, {"num": 11, "text": "人工芝の下地が土の場合は、踏圧や加重により人工芝に不陸ができる可能性があります。下地が土の場合は、ある程度の凹凸を想定のうえでご発注ください。なお、予め不陸を防ぐ方法としては、下地に歩道用コンクリートを打設する方法をお勧めいたします。➡写②"}], "checked": false}, {"label": "観葉植物", "content": [{"num": 1, "text": "観葉植物の管理については、別紙「観葉植物の管理方法」に従って管理していただきますようお願いします。適正な管理をしているにも関わらず、納品後3ヵ月以内に枯死に至った場合には同等品にて植替え致します。ただし、枯死に至る前に生育不良の旨のご連絡を頂くことが前提となりますことを予めご了承下さい。また、特殊樹形や特殊品目など同等品での植替えが困難な場合には、樹種変更や樹形変更により対応させていただきます。※観葉植物の枯死とは、樹高の50％以上が枯込んだ場合を指します。"}, {"num": 2, "text": "鉢について、素焼きやテラコッタなど材質によっては鉢の中の水分によって鉢色が変化することがあります。また、設置環境によっては苔などが生えることもあります。"}], "checked": false}, {"label": "コンクリート土間①", "content": [{"num": null, "text": "コンクリート土間（透水性・不透水性）"}, {"num": 1, "text": "コンクリート土間（透水性及び不透水性）は化学反応により強固な土間を作ります。よって製品性質上、色ムラは避けることができません。また、施工は職人が手仕事で行っていますので、機械生産のような均一な仕上がりはできません。なお、色ムラは強度に影響を与えるものではありません。ムラが酷く出た場合は、時間と共に薄くなることが多いため、施工後8か月間状況変化を確認ください。その後なお色ムラが酷く残る場合は、1,000円／㎡（税込）の減額もしくは、補修塗装にて対処させていただきますことを予めご了承ください。➡写①"}, {"num": 2, "text": "コンクリート（透水性及び不透水性）は、区画ごとで打設するミキサー車を入れ替える場合があります。ミキサー車毎に僅かにコンクリートの色合いが変わることがありますので、予めご了承ください。"}, {"num": 3, "text": "コンクリート土間(不透水性)は、性質上表面に小さな亀裂が生じます。亀裂は製品の強度に影響を与えるものではありませんが、施工後2年以内に亀裂幅が5mmを超える場合は、亀裂にモルタル充填することで対処致します。➡写②"}, {"num": 4, "text": "コンクリート（透水性及び不透水性）打設後、表面が固まるまでの間に上を歩かれますと足跡がつきます。万一凹みなどが生じた場合は、部分補修をすることは可能ですが、色むらができますことを予めご了承ください。猫などの動物についても同様の扱いとなります。"}, {"num": 5, "text": "色コンクリート土間（不透水性）は、色ムラが出ることが多くあります。色ムラは製品性質上避けることが出来かねますので、予めご理解の上ご検討ください。また、色コンクリート土間完成後に、デッキブラシなどで擦ることで色ムラが生じる場合もあります。"}, {"num": 6, "text": "コンクリート土間の仕上げによっては、表面が濡れた時に滑りやすくなることがあります。転倒などによる怪我については責任を負いかねますので、予めご理解の上注文願います。"}, {"num": 7, "text": "コンクリート（透水性及び不透水性）は気温の変化と共に伸縮します。よって、広面積のコンクリート土間の場合は伸縮による割れを最小限にするために、伸縮目地を設置します。そのため、伸縮目地付近には必ず隙間が発生しますことを予めご了承ください。➡写③"}, {"num": 8, "text": "コンクリート（透水性及び不透水性）は、乾燥することで強度が高まりますので、打設後に乾燥のための時間が必要です。よって、打設後7～10日間（季節による）は使用することができないことを予めご了解ください。"}, {"num": 9, "text": "コンクリート土間（不透水性）は、雨などの水を表面勾配にて排水する必要があります。コンクリート土間施工は職人の手作業で行いますので、勾配が取れない場合はどうしても水溜りができる可能性が高くなります。よって、目安として勾配2%（5mで10㎝）以上を確保できる必要がありますことをご了承ください。万一、2%以上の勾配があるにも関わらず、24時間以上の水溜りが生じる場合には、該当部分に目地（切目）を入れるか、もしくは、該当部分のみ切断撤去して、再度打設することにより排水補修を無償で行います。なお、補修時には該当部分のデザインが多少変わることをご理解ください。ただし、2%未満での施工をご要望の際には、補修が有料になりますことを予めご了解の上、ご発注ください。➡写④"}, {"num": 10, "text": "コンクリート（透水性及び不透水性）土間打設工事（基礎及び下地は除く）は気温が低いと固結反応に時間がかかり、場合によっては表面が剥離する現象が起きやすくなるため、気温の低い季節（12月～2月）の施工は好ましくありません。よって、この季節の打設工事は行いません。お客様のご都合により、この季節に打設工事を望まれる場合は早強コンクリート（通常は普通コンクリート）により硬化を早める対策を取りますが、万一不具合が起きた場合でも、補修等をできませんので、予めご了承ください。➡写⑤"}, {"num": 11, "text": "コンクリート土間完成後は、タイヤ痕が目立ちやすくなりますことをご理解ください。➡写⑥"}], "checked": false}, {"label": "コンクリート土間②", "content": [{"num": null, "text": "コンクリート土間（透水性・不透水性）"}, {"num": 12, "text": "コンクリート土間（透水性）は、物理的に隙間を作ることによって透水機能を持っています。よって、土やホコリなどが土間上に堆積すると、目詰まりを起こして、透水機能が低下します。"}, {"num": 13, "text": "コンクリート土間（透水性）は、製品性質上表面を平らに仕上げることが困難です。よって、表面には不陸が必ず生じますので、ご理解の上発注ください。"}, {"num": 14, "text": "コンクリート土間（透水性）は、表面に骨材が見えた状態で仕上がります。この骨材は土間ご使用中に外れていきます。そのために外れが部分が色ムラになることがあります。性能上の問題はございませんが、十分にご理解の上発注ください。"}, {"num": 15, "text": "コンクリート土間を打設する際には、コンクリートの強度を高めるため、鉄筋やポリオレフィン系補強繊維を混入します。そのため、コンクリート土間の表面に繊維が一部現れる場合があります。品質上は問題ありませんが、地表面に繊維が目立つ場合は、バーナー焼き等により表面繊維を目立たないような処理を行います。➡写①"}, {"num": 16, "text": "透水性コンクリートは、土中の排水性が低い場合、コンクリート下に水が溜まることによって白華現象（表面が白く粉がつくこと）が生じやすくなります。白華現象が生じた場合でも、製品の強度には影響はありませんが、特にカラー塗装した場合は見た目を損ねますので、別途土中の排水工事をお勧めいたします。➡写②"}], "checked": false}, {"label": "給排水", "content": [{"num": 1, "text": "排水工事には、「表面排水」と「暗渠排水」があります。\n　「表面排水」は、地表面に勾配をつけることで、雨水を排水する方法で、短時間に大量の水を排水することが出来ます。➡写①　よって、表面排水は集まった水を流すための側溝や雨水桝の容量により、一度に排水できる水量が決定されます。\n　「暗渠排水」は、地中に暗渠配管を埋設することで、地中に浸透した雨水を排水する方法で、時間をかけて、少しずつ水を排水することが出来ます。➡写②　よって、暗渠排水は、埋設する排水管の量と排水先の容量により、排水にかかる時間が左右されます。\n　いずれの方法も、集中豪雨による短時間における大量雨量への対応はできない場合があります。特に暗渠排水は、排水速度が遅いですので、少量雨量であっても一時的な水溜りは避けられません。上記の性質をご理解の上、排水計画を決定いただきますよう予めお願いします。"}, {"num": 2, "text": "排水工事については、工事場所の地中の排水能力や周辺近隣の雨水排水経路などにより排水能力を決定しなければなりません。しかし、前述の状況を完全に把握することは困難です。また、過剰な排水能力を見込んだ施工は工事価格を高騰させます。よって、排水に関しては、ヒヤリング及び目視調査にて想定される範囲での排水能力をご提案しています。万一、想定以上の雨水量が流入または、想定以上の既存地盤排水能力不足の場合は、別途有料にて排水追加工事のご提案をいたします。予めご了承いただき、現地の排水状況確認にご協力をお願いいたします。"}], "checked": false}, {"label": "石貼り", "content": [{"num": 1, "text": "自然石の石貼りは、天然の石を使用しているため表面に凸凹が生じます。よって、歩行の際の多少歩き辛かったり雨天時に凹部分に水が溜まることを予め了承下さい。"}, {"num": 2, "text": "乱貼りは自然石性質上、目地を正確に均一の隙間にすることは困難です。よって、目地幅は大小が生じますことをご理解ください➡写①"}], "checked": false}, {"label": "砂利", "content": [{"num": 1, "text": "猫や犬などの動物が糞や尿をすることがあります。"}, {"num": 2, "text": "砂利の種類によっては、踏圧により砕かれ粉が発生する場合があります。予めご了承ください。"}, {"num": 3, "text": "防草シート上に砂利を敷設しても、砂利の中から雑草が生えてくる場合があります。予めご了承ください。➡写①"}, {"num": 4, "text": "川砂利は、生産過程上、川の砂が混じることがありますことを予めご了承ください。"}, {"num": 5, "text": "砂利の粒には、製造上細かなものも含まれますことを予めご了承ください。"}], "checked": false}, {"label": "防草シート", "content": [{"num": null, "text": "防草シートについて"}, {"num": 1, "text": "端部や重なり部分などは草が生えることがあります。完全に雑草を防ぐことはできませんので、予めご了承ください。➡写①"}, {"num": 2, "text": "直射日光が当たる場合は劣化が早いため、砂利を敷くなどの日光を防ぐ方法をお勧めいたします。"}, {"num": 3, "text": "防草シートは、鋭い道具で突き刺したり、犬がシートの上を掘ったりした場合、破れたり避けたりする場合があります。その際は別途補修作業（有料）が必要となりますので、ご使用の際にはご注意ください。"}, {"num": 4, "text": "防草シートは、地形の影響や、作業上の制約により、必ずしも表面が平たく仕上がるとは限りません。表面にシワが寄ることを予めご了承ください。➡写②"}], "checked": false}, {"label": "除草", "content": [{"num": 1, "text": "除草剤散布は葉に直接散布して根まで枯らせる性質の薬剤（浸透移行型）を使用致します。しかし、以下のような植物及び状態の場合は、一度の散布で完全に枯らすのは困難であるため完全に枯らす責任は負いかねますことを予めご了承ください。\n・雑草の種・トクサ・スギナなどの地下茎で繁茂する植物・球根類・竹、笹類"}, {"num": 2, "text": "浸透移行型除草剤の効果は、雑草の種類や環境によって違いが出ます（2～4週間程度）。よって、雑草が多種の場合は枯れるタイミングにずれが生じますが、これは散布のムラによるものではありません。また、浸透移行型の除草剤は種子には効かないため、散布後まもなく種子が発芽することを防げることはできません。"}, {"num": 3, "text": "除草剤散布について、庭木の根元付近への散布は庭木へ影響する可能性がありますので、散布できません。よって、庭木の根元付近は除草剤散布ができないことを予めご了解ください。"}, {"num": 4, "text": "機械での草刈り作業は、樹木の幹に傷がつく可能性があるため、幹の際での作業は出来かねます。"}, {"num": 5, "text": "機械での草刈り作業は、地表の小石を飛ばして危険です。よって、地表に小石等が敷いてある場合は、地表よりも高いところで刈ることで対処いたします。"}, {"num": 6, "text": "草刈り及び草抜き作業において、対象範囲に刈り抜きしてはならない庭木や草がある場合は、予め印付け等により明確に見分けがつくようにした上で、その旨をお伝えください。見分けがつかない場合は、刈り抜きの対象となりますので、ご注意ください。"}, {"num": 7, "text": "草刈り作業は、草の根が残るので、すぐに草が生えることをご理解ください。"}, {"num": 8, "text": "苔類は性質上、除草剤散布で枯らすことは難しいことをご理解ください。"}, {"num": 9, "text": "草抜きは、草の種類によっては根が残ります。また、小さな草（1㎝程度以下）は物理的に作業が困難となり草が残ります。その場合は合わせて除草剤散布作業もご検討ください。"}, {"num": 10, "text": "芝生への除草剤散布については、選択性除草剤により特定の雑草を駆除する方法があります。しかし、除草剤の種類はその都度変わるため、完全に薬剤を適合させることは困難です。また、スギナなど除草剤が聞き難い雑草がありますので、完全に駆除することはできません。その場合は、浸透移行性の除草剤を塗布することで、塗布した雑草を根まで枯らす方法が有効です。その際は、どうしても周辺の芝生が枯死しますことをご了承ください。"}], "checked": false}, {"label": "剪定", "content": [{"num": 1, "text": "剪定作業は庭木の樹形を整えることを目的として行いますが、庭木の枝を切除することから庭木の生長に対していくらかの影響を与えます。樹勢の衰退している庭木などは、場合によっては剪定後に枯死する可能性が無いとはいえません。しかし、枯死した場合でも補償したり、無償で処分をしたりなど、その責任を負うことは一切出来かねますことを予めご理解の上、ご発注いただきますようお願い致します。"}, {"num": 2, "text": "庭木は剪定作業以外の条件によっても花や実の量が変動いたします。よって、花や実の量に対するご要望にはお応えできないことがございますことを予めご了承願います。"}, {"num": 3, "text": "作業内容によっては機械音などが発生する場合がございます。音の発生に不都合が生じる場合は予めお伝えください。"}, {"num": 4, "text": "作業内容によってはホコリ等が舞う場合がございます。よって、作業日には洗濯物等を取り込んでいただき、窓を閉じていただきますようお願いします。"}, {"num": 5, "text": "剪定作業は天候に左右されるため、状況によっては急遽作業を中止する場合がございます。"}, {"num": 6, "text": "作業範囲にハチの巣などの危険な状況を確認した場合は、一旦作業を中止して駆除専門会社への依頼をお願いする場合があります。その際にはご協力の程をお願いします。"}, {"num": 7, "text": "剪定後の清掃については、丁寧に作業を行いますが、雨の影響で葉がくっついたり、長年の堆積していたりなど、状況によっては葉等が残る場合がありますことを、ご理解願います。"}, {"num": 8, "text": "強剪定する場合の適期は新芽が出る時期である春頃となります。それ以外の時期に行うと、場合によっては、枝が枯れたり、樹勢が衰えたりする場合がございます。なお、強剪定は度合いにもよりますが、庭木に大きな負担がかかりますので、適期に行っても枝枯れや衰退(切り口からの腐朽等)は避けられないことを予めご了承下さい。特にクロマツを代表する針葉樹は強剪定を嫌いますので、強剪定をする場合は枯損覚悟にてご発注ください。"}, {"num": 9, "text": "強剪定や部分的に強く剪定した場合には、一時的に葉が薄くなったり、全くない状態となったりします。その際一定期間のおいて、庭木としての見栄えが落ちますことを予めご了承ください。"}, {"num": 10, "text": "花や実は個体差や環境変化によって左右されるため、花や実付きを考慮して剪定時期を適した季節にした場合であっても、必ずしも花や実付きの量を保証するものではございません。予めご了承ください。"}], "checked": false}, {"label": "害虫駆除薬剤散布", "content": [{"num": 1, "text": "薬剤散布時には、洗濯物の取り込み、窓閉めを必ず行っていただきますようお願いします。また、隣接している家へ薬剤が飛散する恐れがある場合には、ご挨拶の上作業を行いますが、予め散布作業の話を隣家にお声がけいただきますようお願いします。"}, {"num": 2, "text": "薬剤散布作業は雨や風などの天候に左右されるため、状況によっては急遽中止することがございます。"}, {"num": 3, "text": "薬剤が庭木以外（石、窓ガラス）に付着しないよう気をつけますが、万一付着した際には水で洗い流して落としますのでご安心ください。なお、予防のため予め水で濡らしてから散布するとこともございます。ただし、車への付着が予想される場合は作業ができませんので、予め動かしていただくか、シートなどで養生していただきますようお願いします。"}, {"num": 4, "text": "薬剤散布時に散布用機械を使用する場合がございます。その際に機械音が発生いたしますことを予めご了承ください。"}, {"num": 5, "text": "害虫の卵には薬剤が効かないため、薬剤散布後間もなく幼虫が発生する可能性があります。この場合薬剤散布ではそもそも解決できないので、作業不良ではありません。また、マツクイムシ防除薬剤散布等の防除用薬剤散布は、完全には防除できなことをご了承ください。"}, {"num": 6, "text": "幹に穴を開けて庭木を衰退させる総称テッポウムシについては、オプションとして予防薬剤塗布をご用意しておりますが、生きものであるが故に決して100%予防できるものではないことを予めご了承ください。"}, {"num": 7, "text": "果樹やハーブなど食することを目的に栽培されている庭木がある場合は、薬剤散布の対象から外しますので、事前にお知らせいただきますようお願いします。ただし、散布対象庭木の付近にある場合は、除外しても飛散する可能性があることをご了承ください。"}, {"num": 8, "text": "カイガラムシ駆除や殺菌などに使用する石灰硫黄合剤は、散布や塗布した後にしばらく対象庭木が白色になります。白色は雨により徐々に流れて戻りますが、数週間から数か月間に渡り白色が残る場合があります。また、薬剤散布直後は対象庭木周辺に不快な硫黄臭が致します。予めご了承のうえ、ご発注ください。"}, {"num": 9, "text": "薬剤散布は、樹木の生育状況や散布時の気象条件などの影響により、生理的障害を起こすことがあります。そのような障害を薬害といい、葉などの外観にマイナスの影響が現れます。薬害は一時的な現象であり、その後回復します。薬害の可能性を予め予測することは困難のため、薬害の可能性も含めてご発注いただきますようお願いします。"}], "checked": false}, {"label": "施肥", "content": [{"num": 1, "text": "地面に芝や苔などが植栽してある場合は、一度植栽を取り除き、施肥後に復旧しますので、その後乾燥するようであれば灌水作業を行っていただきますようお願いします。"}, {"num": 2, "text": "肥料には、有機肥料と無機肥料がございますが、最適な肥料を当社で選択し施します。"}, {"num": 3, "text": "有機肥料の施肥作業は、地面を掘って埋め戻しますので、地表が多少陥没したり凸凹することをご理解ください。"}, {"num": 4, "text": "防草シート等が敷設してある場合は、化成肥料もしくは液体肥料を使用いたします。"}], "checked": false}, {"label": "塀・壁・塗装・コーティング", "content": [{"num": 1, "text": "門壁やブロック塀などの壁部分は雨垂れによる筋状の汚れが生じます。➡写①"}, {"num": 2, "text": "塗装する場合、色合いは見本と実際の仕上がりとでは、同じ色でも面積の関係で違って見えることがあります。面積が広くなると薄く見えることを予め踏まえて色決定をして下さい。"}, {"num": 3, "text": "塗装する場合、現場での手作業で行いますので、工場生産のように完全に均一な仕上がりにはなりません。多少のムラやコテ跡が残ることを予めご了承ください。➡写②"}, {"num": 4, "text": "塗装した直後に雨に降られた時は塗装が剥げることがあります。その場合は剥げた部分を補修いたします。なお、自然現象以外（ホースで水を撒いた、ボールがぶつかった等）で剥げた場合は補修できかねます。"}, {"num": 5, "text": "塀・壁は下地がコンクリート製品である場合、性質上、白華現象（表面が白く粉がつくこと）が生じることがあります。その場合、製品の強度に影響を与えるものではありません。白華現象が生じた場合入れ替えなどの補償は致しかねますので、予めご了承ください。なお、掃除の方法としてサンポールなど酸性の洗剤で洗浄すると落とすことができます。"}, {"num": 6, "text": "スーパートップコートなどのコーティング処置は壁等に汚れがつくのを防ぐ商品ですが、完全に汚れをなくすることは出来ません。また、材質や環境により汚れ防止効果も様々です。よって、汚れ防止効果に対する保証は出来かねますことを予めご了承ください。"}, {"num": 7, "text": "吹付け工法による塗装については、骨材の性質や人力施工上の僅な厚みの違いなどにより、どうしても仕上がりに色ムラが生じますことを予めご了承下さい。➡写③"}], "checked": false}, {"label": "和風庭園", "content": [{"num": 1, "text": "灯ろうなどを移設をする際、年月の経った物は非常にカケ、傷などの破損しやすく なっています。細心の注意を払って作業に当たりますが、万一損傷した場合はボンドでの接着による処置を行うことで対応致しますことを予めご了承下さい。"}, {"num": 2, "text": "和風庭園は仕上がりのイメージを最も大切にして工事に当たります。よって現場を進める上でより仕上がりが良くなると判断し、図面とは多少違う配置や大きさに変更する場合がございますことをご理解下さい。"}], "checked": false}, {"label": "庭木伐採伐根撤去", "content": [{"num": null, "text": "庭木伐採伐根撤去について"}, {"num": 1, "text": "庭木地上部の伐採は、地際での切断となりますが、作業上の理由により地際ギリギリでの切断はできません。小さい株で10㎝程度、大きい株だとそれ以上の高さでの切断となりますことをご了承願います。➡写①"}, {"num": 2, "text": "根株を残した伐採は、その後に根株が虫や菌類によって分解されます。場合によっては、白アリが発生する原因となります。よって、建物近くでは根株を抜根することをお勧めいたします。"}, {"num": 3, "text": "生きている庭木の根を残して伐採した場合、新しい芽が出てくる場合があります。伐採目的が枯死の場合は、新しく出てきた芽に対して除草剤を塗布してください。"}, {"num": 4, "text": "支柱の撤去は、引き抜きが困難な場合は地際で切断し、土中部分の杭は残置します。"}, {"num": 5, "text": "撤去する庭木の周囲に下草などがある場合、作業中にどうしても踏み荒らしてしまう可能性があります。重要な下草などがある場合は、あらかじめ移植するなどして、事前に避難していただきますようお願いいたします。"}], "checked": false}, {"label": "材料支給", "content": [{"num": 1, "text": "お客様にて材料支給する場合は、部材やボンドなどの付属材料も全て準備していただく必要がございます。また、材料の量の計算についても、お客様にて計算して準備していただく必要がございます。材料の過不足が生じた場合は、弊社では責任を負えませんので、予めご了承ください。"}, {"num": 2, "text": "万一、材料が不足した場合は、材料を追加でご用意いただくまで作業が中止となります。その場合は、工期も延長せざるを得ない場合がございますので、ご了承ください。"}, {"num": 3, "text": "支給いただきました材料が余った場合、材料の処分はお客様にて行っていただきますが、処分の依頼を別途いただきましたら有料で処分も可能です。"}, {"num": 4, "text": "材料支給の場合は、材料の品質による不具合については、保証いたしかねますことを予め了承願います。"}, {"num": 5, "text": "材料支給による施工の場合、施工費は着工前金としてお支払いいただきますようお願いします。"}], "checked": false}, {"label": "2m超工作物", "content": [{"num": null, "text": "高さ2mを超える擁壁・ブロック塀等の設置について"}, {"num": 1, "text": "工作物確認申請の義務\n建築基準法第88条に基づき、高さが2mを超える擁壁（土留め）やブロック塀等を設置する場合、着工前にその計画が安全基準に適合しているか「工作物確認申請」を行い、確認済証の交付を受ける義務があります。"}, {"num": 2, "text": "当社の施工および契約の範囲\n当社が提供する工事は、お客様が指定した仕様に基づき、土木・左官技術をもって構造物を構築するものです。本契約の標準工事費には、以下の内容は含まれておりません。\n\n構造計算および設計費用： 2m超の擁壁に求められる強度計算および図面作成。\n\n申請代行費用および手数料： 行政機関への申請実費。"}, {"num": 3, "text": "申請を行わない場合のリスクと安全上の警告\nお客様の判断により、工作物確認申請を行わずに2mを超える構造物を設置する場合、以下のリスクを承諾したものとみなします。\n\n構造的安全性の不透明化： 申請手続き（構造計算）を経ない場合、地震や大雨に対する公的な安全証明が得られません。\n\n行政指導および是正命令： 違法工作物とみなされた場合、行政より解体・再構築を命じられることがあり、その費用はお客様の全額負担となります。\n\n資産価値・融資への不利益： 敷地内に「確認申請のない2m超の擁壁」が存在する場合、その土地・建物は「法令違反」となり、将来の売却や担保評価が著しく低下します。"}, {"num": 4, "text": "免責事項\n当社は、お客様から「申請手続きを行わない状態での施工」を承諾の上で依頼された場合、以下の事項について一切の責任を免れるものとします。\n（1）確認申請未実施に起因する行政処分、および将来の売却時等の損害。\n（2）申請を行わないことによる、公的な安全性の証明不能に関する事項。\n（3）万が一の災害時において、申請手続きを経ていないことに起因する保険支払いの拒否や賠償問題。"}], "checked": false}, {"label": "建築確認申請", "content": [{"num": null, "text": "建築確認申請および登記に関する合意事項"}, {"num": 1, "text": "本契約の法的性質\n本契約は、当社が建築物一式を請け負うものではなく、「製品（カーポート等）の販売」および「お客様が指定した設置場所への製品組立・固定サービス」を目的とするものです。"}, {"num": 2, "text": "建築主（施主）の義務と責任\n建築基準法第6条の規定に基づき、建築確認申請の手続きを行う義務は「建築主（お客様）」にあります。当社が提示する「設置工事」には、以下の費用は含まれておりません。\n\n建築士による設計・申請図面作成費用\n\n特定行政庁（役所）への申請手数料\n\n法令適合（建ぺい率等）を維持するための追加工事費用"}, {"num": 3, "text": "申請を行わない場合のリスクの承諾\nお客様が自らの判断により建築確認申請を行わずに設置を希望される場合、以下のリスクが発生することを十分に理解し、承諾したものとみなします。\n\n是正命令： 行政による調査の結果、製品の撤去や改修を命じられる可能性があります。\n\n融資への影響： 住宅ローンの借り換えやリフォームローンの際、既存不適格と判定され融資が受けられない場合があります。\n\n資産価値： 不動産売却時に「未登記・違法建築あり」とみなされ、査定額の低下や売却の妨げになる場合があります。"}, {"num": 4, "text": "免責事項\n当社は、お客様から「製品の組立作業のみ」を依頼された立場として施工を行います。したがって、以下の事項について当社は一切の責任を負わないものとします。\n\n建築確認申請の未実施に起因する行政処分、近隣トラブル、および金銭的損害。\n\n不動産登記法に基づく表題変更登記（増築登記）の未実施による不利益。\n\n将来的な売却・融資等における適合性に関する保証。\n※ただし、当社の施工上の瑕疵（組立不良等）については、保証規定に基づき責任を負います。"}], "checked": false}, {"label": "工事中", "content": [{"num": 1, "text": "工事期間中に工事内容についての連絡事項が生じた場合は、担当へ直接連絡下さい。緊急時に担当が不在の場合は、現場監督へご連絡下さい。現場の職人に連絡された場合は対応が遅延したり対応できかねる場合がございます。"}, {"num": 2, "text": "外構工事は環境に非常に左右されます。よって、作業予定日の変更などが多々生じます。また、現在職人不足および資材入荷遅延の影響により工事期間が超過する恐れがございます。このような理由から契約書の工期は目安期間であることを予めご了承ください。"}, {"num": 3, "text": "工事において、既存の建物等に弊社の過失で損害を与えた場合は、弊社の責任において補償いたします（場合によっては、損害保険を適用致します）。"}, {"num": 4, "text": "工事期間中は、水道及び外部電気を無料で貸与願います。"}, {"num": 5, "text": "工事期間中は工事車輌用の駐車場（2～3台）が必要となります。また、駐車場工事の場合はお客様の駐車場も別途必要となります。必要な駐車場については、お客様にてご用意ください。また、工事途中で当初想定していた駐車場以上の台数が必要になる場合も同様にお願いします。"}, {"num": 6, "text": "工事前及び工事完了後に、弊社の責任で工事を行う旨の挨拶文書を近隣の皆様へ配布いたします。その後、隣接するご近所については、トラブル回避のため、弊社の挨拶文書とは別にお客様にて予めご挨拶していただきますようお願いします。➡写①"}, {"num": 7, "text": "工事内容によっては、作業の際に音が発生する場合があります。音の発生が生活の弊害になる場合（日中の睡眠、赤ちゃんの睡眠など）がありましたら、作業時間を調整しますので予めご相談ください。また、隣接するご近所についても前述のような状況がある場合は予めご相談ください。"}, {"num": 8, "text": "工事内容によっては、粉じん又は埃の飛散が生じる場合があります。最善の注意を払って作業にあたりますが、飛散を完全に抑えることはできません。よって、工事中に家の中に埃が入らないよう窓を閉めてください。また、洗濯物などについても汚れない場所への移動をお願いします。車についても同様に移動またはカバーなどの養生をして頂きますようお願いします。➡写②"}, {"num": 9, "text": "作業日については、基本的に日曜祝日以外の曜日に作業致しますが、場合によっては変更することもあります。また、天候や工程の都合上急きょ作業を中止する場合もありますので、予めご了承ください。作業時間については、基本的に8時～17時30分の間で作業致します。日によって作業開始時間と終了時間が様々です。"}, {"num": 10, "text": "工事期間中に、天候が良くても現場作業に入らない場合があります。これは、現場以外での準備が必要であったり、職人の体調管理であったりなどの場合ですが、いずれも、工事期間中の工程管理については最善の状況で行っていきますので、弊社にお任せいただきますようお願いします。"}, {"num": 11, "text": "工事作業中に不意に作業員に近づくと非常に危険です。用が生じた場合は、遠くからお声がけいただきますようお願い致します。"}, {"num": 12, "text": "工事期間中は材料などを現地に仮置きする場合がございます。その際、破損防止及び防犯の観点から、段ボールに梱包されている部材、アルミ製品及び使用部材、その他現場監督が指示するものについては養生を行いますが、コンクリート製品、石材、砂利、レンガをはじめその他の材料については特別な養生をせずに仮置きいたします。"}, {"num": 13, "text": "本工事に伴って発生した廃棄物以外に関しては弊社では処分できかねます。その際は一般廃棄物処理業の許可業者にご依頼ください。また、薬品類については専門業者へご依頼ください。"}], "checked": false}, {"label": "キャンセルポリシー", "content": [{"num": null, "text": "工事契約後についての契約解除は、工事着工前と工事着工後のそれぞれにおいて以下の通り定めています。いずれも書面にて契約解除の意思表示が必要となります。予めご了承いただき、十分に検討の上ご契約いただきますようお願いします。"}, {"num": null, "text": "＜工事着工前の契約解除＞\n　契約後、工事着工前に契約解除の意思表示がなされた場合は、以下の項目に該当する代金をご負担いただくことで、契約を解除できます。\n　・すでに仕入れている資材や設備の代金\n　・すでに手配している作業員等の費用\n　・契約締結までに要した打合せや設計の実費や人件費"}, {"num": null, "text": "＜工事着工後の契約解除＞\n　契約後、工事着工後に契約解除の意思表示がなされた場合は、以下の項目に該当する代金をご負担いただくことで契約を解除できます。\n　・すでに仕入れている資材や設備の代金\n　・すでに手配している作業員等の費用"}], "checked": false}, {"label": "工事完成後の保証", "content": [{"num": 1, "text": "工事完成後に保証書を発行し、完成品に対しての品質を保証致します。ただし、下記の様な場合は保証致しかねますので予めご了承ください。"}, {"num": 2, "text": "保証期間以降の機能検査依頼は有料（1,000円/回）で承ります。"}], "checked": false}, {"label": "契約にあたり", "content": [{"num": 1, "text": "工事期間中に、設置位置の調整や詳細箇所の確認など、必要に応じて現地立ち合い確認をお願いすることがあります。しかし、お客様から当初のご契約いただいた図面の内容を変更することは、基本的に出来ませんので、十分に確認していただいた上でのご契約をお願いします。なお、どうしても変更が必要な場合は、工事が中断することや材料の過不足がでることなどにより有料となりますことを予めご了承ください。"}, {"num": 2, "text": "工事請負契約締結が紙面の際は、法律で定められた金額の印紙が必要になります。契約時に印紙代を準備頂きますようお願いします。"}, {"num": 3, "text": "エクステリア商品の設置が建築基準法第6条第1項に定める新築・増築等（中略）に該当する場合に加え、同法第88条に定める「工作物（高さ2mを超える擁壁・ブロック塀等）」を設置する場合も、確認申請等の手続きが必要となります。"}, {"num": null, "text": "木造、鉄骨造その他の構造の\n建築物の一部"}, {"num": null, "text": "※建築物の外壁に固定しない、柱のみで自立するテラス屋根"}, {"num": null, "text": "【重要事項説明：法的申請手続きに関する包括確認・同意事項】\n本工事に含まれる以下の製品・構造物（以下「対象構造物」）の設置に伴う、建築基準法上の申請手続きについて、以下の通り確認・合意いたしました。\n■ 対象構造物の範囲（本工事に含まれるもの）\n・屋根を有する構造物（カーポート、ガーデンルーム、テラス、ストックヤード、大型物置等）\n・高さ2mを超える工作物（擁壁、土留め、ブロック塀等）\n■ 役割分担と義務の所在\n申請義務： 建築基準法上の申請義務は「建築主（お客様）」にあります。\n当社の役割： 当社は「製品販売および設置工事」の請負人であり、建築士事務所ではないため、行政への申請手続きを直接受任することはできません。\n建築士の関与： 申請を行う場合は、当社紹介の外部建築士、またはお客様が選定した建築士とお客様との間で別途契約が必要となります。"}, {"num": null, "text": "【最終選択】※いずれか一つにチェックを入れ、ご署名ください\n□ 1. 専門家（建築士）を通じて適切な申請手続きを行う（推奨）\n建築主（お客様）が主体となり、外部建築士を通じて必要な申請（建築確認・工作物確認等）を行います。\n建築士への報酬および役所への申請手数料等の実費は、お客様の直接負担となることを承諾します。\n\n□ 2. 申請を行わずに「製品の納品および組立・設置作業のみ」を依頼する\n法律上の申請義務があることを理解した上で、お客様の判断により、当社へは「組立・設置作業のみ」を依頼します。\n申請を行わないことによる将来のリスク（行政からの是正命令、住宅ローン審査の不備、不動産売却時の査定下落・売却不能、災害時の安全性未証明等）について、当社は一切の責任を負わないことに同意します。"}, {"num": null, "text": "以上の注意事項について説明を受け、了承しました。"}, {"num": null, "text": "年　　　月　　　日"}, {"num": null, "text": "署名："}], "checked": false}]};

var ADMIN_PASSWORD = '8282';
var GITHUB_USER = 'takezofarm288282-jpg';
var GITHUB_REPO = 'juyo-app';
var GITHUB_FILE = 'data.json';
var githubToken = '';
var isAdminMode = false;
var currentDoc = 'construction';
var currentMode = 'preview';
var data;

// 常時チェック固定項目（外せない）
var FIXED_CHECKED = {
  service: ['庭園清掃', '作業中', 'キャンセルポリシー', '契約にあたり'],
  construction: ['工事中', 'キャンセルポリシー', '工事完成後の保証', '契約にあたり']
};

function isFixed(doc, label) {
  var fixed = FIXED_CHECKED[doc] || [];
  for(var f=0; f<fixed.length; f++) if(fixed[f] === label) return true;
  return false;
}

function enforceFixed() {
  // 固定項目を常にchecked=trueにする
  var items = data[currentDoc];
  for(var i=0; i<items.length; i++) {
    if(isFixed(currentDoc, items[i].label)) {
      items[i].checked = true;
    }
  }
}

function today() {
  var d = new Date();
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}

function loadData() {
  try { var s = localStorage.getItem('juyo_v8'); if(s) { data = JSON.parse(s); return; } } catch(e){}
  data = JSON.parse(JSON.stringify(DEFAULT_DATA));
}
function saveData() { try { localStorage.setItem('juyo_v8', JSON.stringify(data)); } catch(e){} }

function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escNl(s) { return esc(s).split('\n').join('<br>'); }

/* ── サイドバー ── */
function renderSidebar() {
  var items = data[currentDoc];
  var h = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var fixed = isFixed(currentDoc, item.label);
    h += '<div class="ci' + (item.checked ? ' on' : '') + (fixed ? ' fixed-item' : '') + '" onclick="toggleCheck(' + i + ')">';
    if(fixed) {
      h += '<span class="fixed-chk">☑</span>';
    } else {
      h += '<input type="checkbox"' + (item.checked ? ' checked' : '') + ' onclick="event.stopPropagation();toggleCheck(' + i + ')">';
    }
    h += '<label>' + esc(item.label) + (fixed ? ' <span class="lock-icon">🔒</span>' : '') + '</label></div>';
  }
  document.getElementById('checklist').innerHTML = h;
  document.getElementById('sbTitle').textContent = '📋 ' + (currentDoc==='service'?'サッパリーズ':'Takezo Farm');
  updateCount();
}
function toggleCheck(idx) {
  var label = data[currentDoc][idx].label;
  if(isFixed(currentDoc, label)) {
    showToast('⚠️ この項目は常に必須です');
    return;
  }
  data[currentDoc][idx].checked = !data[currentDoc][idx].checked;
  saveCheckState(); renderSidebar(); renderPreview();
}

// スタッフのチェック状態だけ保存（ひな形は変えない）
function saveCheckState() {
  try {
    var checks = {service:{}, construction:{}};
    var docs = ['service','construction'];
    for(var d=0;d<docs.length;d++) {
      for(var i=0;i<data[docs[d]].length;i++) {
        checks[docs[d]][data[docs[d]][i].label] = data[docs[d]][i].checked;
      }
    }
    localStorage.setItem('juyo_checks', JSON.stringify(checks));
  } catch(e){}
}

// スタッフのチェック状態を復元
function loadCheckState() {
  try {
    var s = localStorage.getItem('juyo_checks');
    if(!s) return;
    var checks = JSON.parse(s);
    var docs = ['service','construction'];
    for(var d=0;d<docs.length;d++) {
      for(var i=0;i<data[docs[d]].length;i++) {
        var lbl = data[docs[d]][i].label;
        if(checks[docs[d]] && checks[docs[d]][lbl] !== undefined) {
          data[docs[d]][i].checked = checks[docs[d]][lbl];
        }
      }
    }
  } catch(e){}
}
function checkAll()  { for(var i=0;i<data[currentDoc].length;i++) data[currentDoc][i].checked=true;  saveCheckState();renderSidebar();renderPreview(); }
function checkNone() {
  for(var i=0;i<data[currentDoc].length;i++) {
    if(!isFixed(currentDoc, data[currentDoc][i].label)) {
      data[currentDoc][i].checked=false;
    }
  }
  saveData();renderSidebar();renderPreview();
}
function updateCount() {
  var c=0;
  for(var i=0;i<data[currentDoc].length;i++) {
    if(data[currentDoc][i].checked || isFixed(currentDoc, data[currentDoc][i].label)) c++;
  }
  document.getElementById('cntDisp').textContent = c;
}

/* ── プレビュー ── */
function getCustName() { return document.getElementById('custName').value.trim(); }
function getCustDate() {
  var v = document.getElementById('custDate').value;
  if (!v) return '';
  var parts = v.split('-');
  return parts[0] + '年' + parseInt(parts[1]) + '月' + parseInt(parts[2]) + '日';
}

function renderPreview() {
  var cover = COVERS[currentDoc];
  var cust  = getCustName();
  var items = [];
  for(var i=0;i<data[currentDoc].length;i++) {
    var d = data[currentDoc][i];
    // チェック済み or 固定項目は常に表示
    if(d.checked || isFixed(currentDoc, d.label)) {
      d.checked = true; // 固定項目は確実にchecked=trueにする
      items.push(d);
    }
  }

  var dt2 = getCustDate();
  var h = '<div class="cov">';
  // 表紙ヘッダー行（お客様名・日付）
  h += '<div class="cov-meta">';
  if (cust) h += '<div class="cov-name">お客様：<strong>' + esc(cust) + '</strong></div>';
  else      h += '<div class="cov-name" style="color:#bbb;">お客様名を入力してください</div>';
  if (dt2)  h += '<div class="cov-date">説明日：' + esc(dt2) + '</div>';
  h += '</div>';
  // タイトル
  h += '<div class="cov-ttl">' + cover.title + '</div>';
  // 区切り線
  h += '<div class="cov-divider"></div>';
  // 挨拶文
  h += '<div class="cov-txt">' + esc(cover.intro) + '</div>';
  // 目次（チェック済み項目）
  var checkedItems = [];
  for(var ci=0;ci<data[currentDoc].length;ci++) {
    if(data[currentDoc][ci].checked || isFixed(currentDoc, data[currentDoc][ci].label)) {
      checkedItems.push(data[currentDoc][ci].label);
    }
  }
  h += '<div class="cov-toc">';
  h += '<div class="cov-toc-title">■ 説明項目</div>';
  if(checkedItems.length === 0) {
    h += '<div class="cov-toc-empty">左のリストから項目を選択してください</div>';
  } else {
    h += '<ol class="cov-toc-list">';
    for(var ci=0;ci<checkedItems.length;ci++) {
      h += '<li class="cov-toc-item">' + esc(checkedItems[ci]) + '</li>';
    }
    h += '</ol>';
  }
  h += '</div>';
  h += '</div>';

  if (items.length > 0) {
    for(var j=0;j<items.length;j++) {
      var item = items[j];
      h += '<div class="sc"><div class="sh"><span class="sh-num">' + (j+1) + '.</span> ' + esc(item.label) + '</div><div class="sb2">';
      for(var k=0;k<item.content.length;k++) {
        var c = item.content[k];
        if(c.num!==null && c.num!==undefined) {
          h += '<div class="cr"><span class="cn">' + c.num + '.</span><span class="ct">' + escNl(c.text) + '</span></div>';
        } else {
          h += '<div class="cp">' + escNl(c.text) + '</div>';
        }
      }
      // 画像＋説明テキスト表示（画像なしはプレースホルダー）
      if(IMG_DATA[item.label] && IMG_DATA[item.label].length > 0) {
        h += '<div class="img-row">';
        var imgs = IMG_DATA[item.label];
        for(var m=0;m<imgs.length;m++) {
          h += '<div class="img-card">';
          if(imgs[m].b64) {

/* ── 印刷HTML生成 ── */
function buildPrintHTML() {
  var cover = COVERS[currentDoc];
  var cust  = getCustName();
  var dt    = getCustDate();
  var items = [];
  for(var i=0;i<data[currentDoc].length;i++) {
    var d = data[currentDoc][i];
    // チェック済み or 固定項目は常に表示
    if(d.checked || isFixed(currentDoc, d.label)) {
      d.checked = true; // 固定項目は確実にchecked=trueにする
      items.push(d);
    }
  }

  // ── 表紙ページ（目次付き・独立1ページ） ──
  var h = '<div style="font-family:Meiryo,sans-serif;page-break-after:always;padding:36px 40px;border:3px solid #1a6b3c;border-radius:6px;min-height:85vh;box-sizing:border-box;">';
  // タイトル
  h += '<h1 style="font-size:22px;letter-spacing:0.2em;color:#0f4526;text-align:center;margin-bottom:24px;line-height:1.8;">' + cover.title + '</h1>';
  h += '<div style="border-top:2px solid #1a6b3c;margin-bottom:20px;"></div>';
  // お客様名・日付
  h += '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:20px;">';
  if(cust) h += '<div style="font-size:14px;font-weight:bold;color:#0f4526;">お客様：' + esc(cust) + '</div>';
  else     h += '<div></div>';
  if(dt)   h += '<div style="font-size:12px;color:#666;">説明日：' + dt + '</div>';
  h += '</div>';
  // 挨拶文
  h += '<p style="font-size:11px;line-height:2;color:#444;border-left:3px solid #4caf72;padding-left:12px;margin-bottom:24px;">' + esc(cover.intro) + '</p>';
  h += '<div style="border-top:1px solid #ccc;margin-bottom:16px;"></div>';
  // 目次
  h += '<div style="font-size:13px;font-weight:bold;color:#0f4526;margin-bottom:12px;">■ 説明項目</div>';
  if(items.length > 0) {
    h += '<ol style="margin:0;padding-left:24px;">';
    for(var ti=0; ti<items.length; ti++) {
      h += '<li style="font-size:12px;line-height:2.2;color:#222;">' + esc(items[ti].label) + '</li>';
    }
    h += '</ol>';
  }
  h += '</div>';

  for(var j=0;j<items.length;j++) {
    var item = items[j];
    h += '<div style="font-family:Meiryo,sans-serif;margin-bottom:16px;page-break-before:always;">';
    h += '<h2 style="font-size:12px;background:#1a6b3c;color:#fff;padding:7px 16px;margin:0;">' + esc(item.label) + '</h2>';
    h += '<div style="border:1px solid #ccc;border-top:none;padding:10px 16px;">';
    for(var k=0;k<item.content.length;k++) {
      var c = item.content[k];
      if(c.num!==null && c.num!==undefined) {
        h += '<div style="display:flex;gap:8px;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:11px;line-height:1.75;">';
        h += '<span style="font-weight:bold;color:#1a6b3c;min-width:18px;">' + c.num + '.</span>';
        h += '<span>' + escNl(c.text) + '</span></div>';
      } else {
        h += '<p style="font-size:11px;line-height:1.8;padding:5px 0;border-bottom:1px solid #f0f0f0;margin:0;">' + escNl(c.text) + '</p>';
      }
    }
    if(IMG_DATA[item.label] && IMG_DATA[item.label].length > 0) {
      h += '<div style="display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;justify-content:center;">';
      var pimgs = IMG_DATA[item.label];
      for(var m=0;m<pimgs.length;m++) {
        h += '<div style="text-align:center;">';
        h += '<img src="data:' + pimgs[m].mime + ';base64,' + pimgs[m].b64 + '" style="max-width:200px;max-height:150px;object-fit:contain;border:1px solid #ddd;display:block;margin:0 auto;">';
        if(pimgs[m].caption) {
          h += '<div style="font-size:10px;color:#555;margin-top:5px;text-align:center;">' + esc(pimgs[m].caption) + '</div>';
        }
        h += '</div>';
      }
      h += '</div>';
    }
    h += '</div></div>';
  }
  return h;
}

/* ── 編集 ── */
function renderEdit() {
  var items = data[currentDoc]; var h='';

    var item=items[i];
    h+='<div class="es"><div class="esh">';
    h+='<div class="move-btns">';
    h+='<button class="btn-move" data-idx="'+i+'" onclick="moveSection(parseInt(this.dataset.idx),-1)" title="上へ"'+(i===0?' disabled':'')+'>▲</button>';
    h+='<button class="btn-move" data-idx="'+i+'" onclick="moveSection(parseInt(this.dataset.idx),1)" title="下へ"'+(i===items.length-1?' disabled':'')+'>▼</button>';
    h+='</div>';
    h+='<input type="text" value="'+esc(item.label)+'" onchange="updateLabel('+i+',this.value)">';
    h+='<button class="bi bd" data-idx="'+i+'" onclick="delSection(parseInt(this.dataset.idx))" title="削除">🗑</button></div><div class="esb">';
    for(var k=0;k<item.content.length;k++){
      var c=item.content[k];
      h+='<div class="er"><textarea onchange="updateContent('+i+','+k+',this.value)">'+esc(c.text)+'</textarea>';
      h+='<button class="bi bdr" data-i="'+i+'" data-k="'+k+'" onclick="delRow(parseInt(this.dataset.i),parseInt(this.dataset.k))">🗑</button></div>';
    }
    h+='<button class="btn-ar" data-idx="'+i+'" onclick="addRow(parseInt(this.dataset.idx))">＋ 説明文を追加</button>';
    // 画像管理エリア（自由に追加・削除・説明入力）
    h+='<div class="img-edit-area">';
    h+='<div class="img-edit-title">📷 参考写真</div>';
    var eimgs = IMG_DATA[items[i].label] || [];
    if(eimgs.length === 0){
      h+='<div class="img-empty-hint">まだ写真がありません。下のボタンから追加してください。</div>';
    }
    for(var ei=0;ei<eimgs.length;ei++){
      h+='<div class="img-edit-row">';
      if(eimgs[ei].b64){
        h+='<img src="data:'+eimgs[ei].mime+';base64,'+eimgs[ei].b64+'" class="img-thumb">';
      } else {
        h+='<div class="img-thumb img-placeholder">📷</div>';
      }
      h+='<div class="img-edit-right">';
      h+='<input type="text" class="img-cap-input" value="'+esc(eimgs[ei].caption||'')+'" placeholder="写真の説明を入力..." data-label="'+esc(items[i].label)+'" data-idx="'+ei+'" oninput="updateImgCaption(this.dataset.label,parseInt(this.dataset.idx),this.value)">';
      h+='<div style="display:flex;gap:5px;margin-top:3px;">';
      h+='<label class="btn-replace-img">🔄 変更<input type="file" accept="image/*" style="display:none" data-label="'+esc(items[i].label)+'" data-idx="'+ei+'" onchange="replaceImg(this.dataset.label,parseInt(this.dataset.idx),this)"></label>';
      h+='<button class="btn-del-img" data-label="'+esc(items[i].label)+'" data-idx="'+ei+'" onclick="delImg(this.dataset.label,parseInt(this.dataset.idx))">🗑 削除</button>';
      h+='</div></div></div>';
    }
    h+='<label class="btn-upload-img">＋ 写真を追加<input type="file" accept="image/*" style="display:none" data-label="'+esc(items[i].label)+'" onchange="uploadImg(this.dataset.label,this)" multiple></label>';

  }

  document.getElementById('editTitle').textContent = '✏️ 編集（'+(currentDoc==='service'?'サッパリーズ':'Takezo Farm')+'）';

function moveSection(idx, dir) {
  var items = data[currentDoc];
  var newIdx = idx + dir;
  if(newIdx < 0 || newIdx >= items.length) return;
  if(isFixed(currentDoc, items[idx].label) || isFixed(currentDoc, items[newIdx].label)) {
    showToast('⚠️ 固定項目は移動できません');
    return;
  }
  var tmp = items[idx];
  items[idx] = items[newIdx];
  items[newIdx] = tmp;
  saveData();
  renderEdit();
  renderSidebar();
  renderPreview();
}

function updateLabel(idx,val){data[currentDoc][idx].label=val;}
function updateContent(idx,ci,val){data[currentDoc][idx].content[ci].text=val;}
function addRow(idx){
  var nums=[]; var ct=data[currentDoc][idx].content;
  for(var i=0;i<ct.length;i++) if(ct[i].num!==null) nums.push(ct[i].num);
  var n=nums.length>0?Math.max.apply(null,nums)+1:null;
  data[currentDoc][idx].content.push({num:n,text:''});renderEdit();
}
function delRow(idx,ci){
  if(data[currentDoc][idx].content.length<=1){showToast('最低1つ必要です');return;}
  data[currentDoc][idx].content.splice(ci,1);renderEdit();
}
function addSection(){
  data[currentDoc].push({id:'new_'+Date.now(),label:'新しい項目',content:[{num:1,text:''}],checked:false});
  renderEdit();
  setTimeout(function(){document.getElementById('editList').scrollTop=99999;},100);
}
function delSection(idx){
  if(!confirm('「'+data[currentDoc][idx].label+'」を削除しますか？'))return;
  data[currentDoc].splice(idx,1);renderEdit();
}
function updateImgCaption(label, idx, val){
  if(!IMG_DATA[label]) return;
  IMG_DATA[label][idx].caption = val;
}

function delImg(label, idx){
  if(!IMG_DATA[label]) return;
  if(!confirm('この写真を削除しますか？')) return;
  IMG_DATA[label].splice(idx, 1);
  renderEdit();
}

function uploadImg(label, input){
  if(!input.files || !input.files.length) return;
  var files = Array.from(input.files);
  var loaded = 0;
  files.forEach(function(file){
    var reader = new FileReader();
    reader.onload = function(e){
      var b64 = e.target.result.split(',')[1];
      var mime = file.type;
      if(!IMG_DATA[label]) IMG_DATA[label] = [];
      IMG_DATA[label].push({mime: mime, b64: b64, caption: ''});
      loaded++;
      if(loaded === files.length) renderEdit();
    };
    reader.readAsDataURL(file);
  });
}

function replaceImg(label, idx, input){
  if(!input.files || !input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e){
    var b64 = e.target.result.split(',')[1];
    var mime = file.type;
    IMG_DATA[label][idx].mime = mime;
    IMG_DATA[label][idx].b64 = b64;
    renderEdit();
  };
  reader.readAsDataURL(file);
}

async function pushToGitHub() {
  if(!githubToken) {
    showToast('⚠️ まずGitHub Tokenを設定してください');
    return;
  }
  showToast('📤 GitHubに送信中...');

  // 現在のHTMLファイルのsaveData内容をGitHubのindex.htmlとして更新
  // まず現在のSHA取得
  try {
    var res = await fetch('https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + GITHUB_FILE, {
      headers: { 'Authorization': 'token ' + githubToken, 'Accept': 'application/vnd.github.v3+json' }
    });
    var sha = '';
    if(res.ok) { var j = await res.json(); sha = j.sha; }

    // 現在のHTMLのDEFAULT_DATAとCOVERSとFIXED_CHECKEDを書き換えたコンテンツを送信
    // dataをJSONとして別ファイルに保存
    var dataContent = JSON.stringify({
      data: data,
      covers: COVERS,
      fixed: FIXED_CHECKED,
      imgData: IMG_DATA
    }, null, 2);

    var encoded = btoa(unescape(encodeURIComponent(dataContent)));
    var body = { message: 'ひな形を更新', content: encoded };
    if(sha) body.sha = sha;

    var putRes = await fetch('https://api.github.com/repos/' + GITHUB_USER + '/' + GITHUB_REPO + '/contents/' + GITHUB_FILE, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + githubToken,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });

    if(putRes.ok) {
      showToast('✅ ひな形を保存しました');
    } else {
      var err = await putRes.json();
      showToast('❌ エラー：' + (err.message || '送信失敗'));
    }
  } catch(e) {
    showToast('❌ 通信エラー：' + e.message);
  }
}

async function loadFromGitHub() {
  try {
    var url = 'https://raw.githubusercontent.com/' + GITHUB_USER + '/' + GITHUB_REPO + '/main/data.json?t=' + Date.now();
    var res = await fetch(url);
    if(!res.ok) return;
    var saved = await res.json();
    if(saved.covers) COVERS = saved.covers;
    if(saved.fixed) FIXED_CHECKED = saved.fixed;
    if(saved.imgData && Object.keys(saved.imgData).length > 0) {
      // GitHubのimgDataが空でない場合のみ上書き
      var hasImages = false;
      for(var k in saved.imgData) {
        if(saved.imgData[k] && saved.imgData[k].length > 0 && saved.imgData[k][0].b64) {
          hasImages = true; break;
        }
      }
      if(hasImages) IMG_DATA = saved.imgData;
      else IMG_DATA = JSON.parse(JSON.stringify(DEFAULT_IMG_DATA));
    } else {
      IMG_DATA = JSON.parse(JSON.stringify(DEFAULT_IMG_DATA));
    }
    if(saved.data) {
      data = saved.data;
      // 不正項目を除去＋固定項目以外チェックをすべて外す
      var docs2 = ['service','construction'];
      for(var d2=0; d2<docs2.length; d2++) {
        data[docs2[d2]] = data[docs2[d2]].filter(function(item) {
          return item.label && item.label !== '新しい項目' && item.label.trim() !== '';
        });
        for(var i2=0; i2<data[docs2[d2]].length; i2++) {
          if(!isFixed(docs2[d2], data[docs2[d2]][i2].label)) {
            data[docs2[d2]][i2].checked = false;
          } else {
            data[docs2[d2]][i2].checked = true;
          }
        }
      }
    }
    // Takezo Farmをデフォルトで表示
    currentDoc = 'construction';
    document.getElementById('tabS').className = 'tb';
    document.getElementById('tabK').className = 'tb on';
    renderSidebar();
    renderPreview();
  } catch(e) {}
}

}

function renderFixedList() {
  var items = data[currentDoc];
  var fixed = FIXED_CHECKED[currentDoc] || [];
  var h = '';
  for(var i=0; i<items.length; i++) {
    var isF = false;
    for(var f=0; f<fixed.length; f++) if(fixed[f] === items[i].label) { isF=true; break; }
    h += '<button class="fixed-tag' + (isF ? ' fixed-tag-on' : '') + '" data-label="'+esc(items[i].label)+'" onclick="toggleFixedItem(this.dataset.label)">';
    h += (isF ? '🔒 ' : '□ ') + esc(items[i].label);
    h += '</button>';
  }
  document.getElementById('fixedList').innerHTML = h;
}

function toggleFixedItem(label) {
  var fixed = FIXED_CHECKED[currentDoc] || [];
  var idx = -1;
  for(var f=0; f<fixed.length; f++) if(fixed[f] === label) { idx=f; break; }
  if(idx >= 0) {
    // 固定解除
    fixed.splice(idx, 1);
  } else {
    // 固定追加
    fixed.push(label);
    // チェックも入れる
    for(var i=0; i<data[currentDoc].length; i++) {
      if(data[currentDoc][i].label === label) data[currentDoc][i].checked = true;
    }
  }
  FIXED_CHECKED[currentDoc] = fixed;
  saveData();
  renderFixedList();
  renderSidebar();
  renderPreview();
  showToast(idx >= 0 ? '🔓 固定を解除しました' : '🔒 固定しました');
}

    return;
  }
  currentMode=mode; var isEdit=(mode==='edit');
  document.getElementById('previewArea').style.display=isEdit?'none':'';
  document.getElementById('outputBar').style.display=isEdit?'none':'';
  document.getElementById('editPanel').className='ep'+(isEdit?' on':'');
  document.getElementById('tabE').className='tb'+(isEdit?' on':'');
  if(isEdit) renderEdit(); else renderPreview();
}

function showToast(msg){
  var t=document.getElementById('toast');

  setTimeout(function(){t.className='toast';},2800);
}
