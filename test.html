<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>テスト表示</title>
</head>
<body>
  <h1 id="status">表示テスト中...</h1>
  <div id="app"></div>

<script>
window.onload = function() {
    const app = document.getElementById('app');
    // 強制的に「工事中」を表示させる
    app.innerHTML = "<div style='border:1px solid red; padding:20px;'><h1>工事中</h1><p>このデータが表示されればプログラムは正常です。</p></div>";
    document.getElementById('status').innerText = "表示完了";
};
</script>
</body>
</html>
