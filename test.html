<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重要事項説明書</title>
<style>
:root{  --g:   #1a6b3c;  --gd:  #0f4526;  --gl:  #e8f4ed;  --gm:  #4caf72;  --or:  #c0392b;  --orl: #fff0ee;  --t1:  #1a1a1a;  --t2:  #444;  --t3:  #888;  --t4:  #ccc;  --bg:  #f0f4f2;  --wh:  #ffffff;  --sh:  0 2px 10px rgba(0,0,0,0.09);  --r:   10px;}*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}body{font-family:Meiryo,'Yu Gothic',sans-serif;background:var(--bg);color:var(--t1);min-height:100vh;font-size:14px;}
.hdr{background:var(--gd);color:#fff;padding:0 16px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 8px rgba(0,0,0,0.2);}.hdr-title{font-size:15px;font-weight:700;letter-spacing:0.04em;}.hdr-title span{color:#7ed8a0;}.hdr-tabs{display:flex;gap:3px;}.tb{padding:5px 12px;border:none;background:transparent;color:rgba(255,255,255,0.6);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border-radius:5px;transition:all .2s;}.tb:hover{background:rgba(255,255,255,0.1);color:#fff;}.tb.on{background:rgba(255,255,255,0.2);color:#fff;font-weight:700;}
.cust-bar{background:#fff;border-bottom:2px solid var(--gl);padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}.cust-bar label{font-size:12px;font-weight:700;color:var(--gd);white-space:nowrap;}.cust-input{flex:1;min-width:160px;max-width:320px;border:1.5px solid var(--t4);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:14px;color:var(--t1);transition:border .15s;}.cust-input:focus{border-color:var(--g);outline:none;}.date-input{border:1.5px solid var(--t4);border-radius:6px;padding:7px 10px;font-family:inherit;font-size:13px;color:var(--t1);transition:border .15s;background:#fff;}.date-input:focus{border-color:var(--g);outline:none;}.date-lbl{font-size:12px;color:var(--t3);white-space:nowrap;}
.main{display:flex;height:calc(100vh - 56px - 45px);}
.sb{width:240px;min-width:240px;background:#fff;border-right:1px solid #dde8e2;display:flex;flex-direction:column;overflow:hidden;}.sb-hd{padding:10px 14px 8px;background:var(--gl);border-bottom:1px solid #dde8e2;}.sb-hd h2{font-size:11px;font-weight:700;color:var(--gd);}.sb-acts{display:flex;gap:5px;margin-top:7px;}.sb-acts button{flex:1;padding:4px 0;font-size:11px;font-family:inherit;border:1px solid var(--g);border-radius:4px;cursor:pointer;font-weight:600;transition:all .15s;}.btn-all{background:var(--g);color:#fff;}.btn-all:hover{background:var(--gd);}.btn-non{background:#fff;color:var(--g);}.btn-non:hover{background:var(--gl);}.cl{flex:1;overflow-y:auto;padding:4px 0;}.ci{display:flex;align-items:center;gap:8px;padding:6px 14px;cursor:pointer;border-left:3px solid transparent;transition:background .12s;}.ci:hover{background:var(--gl);}.ci.on{border-left-color:var(--g);background:#f0faf4;}.ci input[type=checkbox]{width:14px;height:14px;accent-color:var(--g);cursor:pointer;flex-shrink:0;}.ci label{font-size:12px;color:var(--t2);cursor:pointer;flex:1;line-height:1.35;}.ci.on label{color:var(--gd);font-weight:600;}
.cnt{flex:1;display:flex;flex-direction:column;overflow:hidden;}.pv{flex:1;overflow-y:auto;padding:20px 24px;}.dp{max-width:720px;margin:0 auto;}
.cov{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:24px 36px;margin-bottom:16px;border-top:5px solid var(--g);}.cov-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}.cov-name{font-size:14px;font-weight:700;color:var(--g);}.cov-date{font-size:12px;color:var(--t2);}.cov-ttl{font-size:20px;font-weight:700;color:var(--gd);text-align:center;letter-spacing:0.18em;margin-bottom:14px;}.cov-txt{font-size:12px;line-height:1.9;color:var(--t2);border-left:3px solid var(--gm);padding-left:12px;margin-bottom:16px;}.cov-toc{background:var(--gl);padding:12px;border-radius:6px;}.cov-toc-title{font-size:12px;font-weight:700;color:var(--gd);margin-bottom:6px;}.cov-toc-list{padding-left:20px;font-size:12px;color:var(--t2);line-height:1.6;}.sc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);margin-bottom:12px;overflow:hidden;border:1px solid #dde8e2;}.sh{background:var(--g);color:#fff;padding:9px 20px;font-size:12px;font-weight:700;}.sb2{padding:14px 20px;}.cr{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid #f5f5f5;font-size:12px;line-height:1.8;}.cr:last-child{border-bottom:none;}.cn{font-weight:700;color:var(--g);min-width:18px;flex-shrink:0;}.ct{color:var(--t2);white-space:pre-wrap;}.cp{padding:5px 0;font-size:12px;line-height:1.8;color:var(--t2);border-bottom:1px solid #f5f5f5;}.cp:last-child{border-bottom:none;}
.ob{border-top:1px solid #dde8e2;background:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;height:52px;}.ob-info{flex:1;font-size:12px;color:var(--t3);}.ob-info strong{color:var(--gd);}.btn-pr{padding:8px 22px;background:var(--g);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(26,107,60,0.25);}.btn-pr:hover{background:var(--gd);transform:translateY(-1px);}.btn-pd{padding:8px 22px;background:var(--or);color:#fff;border:none;border-radius:6px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;box-shadow:0 2px 6px rgba(192,57,43,0.25);}.btn-pd:hover{background:#922b21;transform:translateY(-1px);}
.ep{display:none;flex:1;flex-direction:column;overflow:hidden;}.ep.on{display:flex;}.et{background:#fff;border-bottom:1px solid #dde8e2;padding:9px 20px;display:flex;align-items:center;gap:8px;}.et h2{font-size:13px;font-weight:700;color:var(--gd);flex:1;}.btn-as{padding:6px 16px;background:var(--g);color:#fff;border:none;border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}.btn-as:hover{background:var(--gd);}.btn-sv{padding:6px 16px;background:#fff;color:var(--g);border:2px solid var(--g);border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}.btn-sv:hover{background:var(--gl);}.btn-bk{padding:6px 14px;background:#f5f5f5;color:var(--t2);border:1px solid var(--t4);border-radius:5px;font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;}.btn-bk:hover{background:#e8e8e8;}.btn-cover-edit{padding:6px 14px;background:#fff3cd;color:#856404;border:1px solid #ffc107;border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}.btn-cover-edit:hover{background:#ffc107;color:#fff;}.btn-reset{padding:6px 12px;background:#fff;color:#999;border:1px solid #ddd;border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;}.btn-reset:hover{background:#fee;color:#c0392b;border-color:#c0392b;}
.move-btns{display:flex;flex-direction:column;gap:2px;flex-shrink:0;}.btn-move{width:24px;height:18px;border:1px solid var(--t4);background:#f5f5f5;border-radius:3px;cursor:pointer;font-size:9px;color:var(--t2);display:flex;align-items:center;justify-content:center;line-height:1;padding:0;transition:all .15s;}.btn-move:hover:not([disabled]){background:var(--g);color:#fff;border-color:var(--g);}.btn-move[disabled]{opacity:0.3;cursor:default;}
.fixed-item{background:#f0faf4!important;}.fixed-item label{color:var(--gd)!important;font-weight:600!important;}.lock-icon{font-size:10px;opacity:0.6;}.fixed-chk{font-size:15px;color:var(--g);flex-shrink:0;line-height:1;display:flex;align-items:center;}.btn-fixed-edit{padding:6px 12px;background:#e8f0fe;color:#1a4a80;border:1px solid #a8c0f0;border-radius:5px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;}.btn-fixed-edit:hover{background:#1a4a80;color:#fff;}.fixed-tag{padding:5px 10px;background:#f5f5f5;color:var(--t2);border:1px solid var(--t4);border-radius:20px;font-family:inherit;font-size:11px;cursor:pointer;transition:all .15s;}.fixed-tag:hover{border-color:var(--g);color:var(--g);}.fixed-tag-on{background:var(--gl);color:var(--gd);border-color:var(--g);font-weight:700;}
.img-row{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding-top:12px;border-top:1px dashed #ddd;justify-content:center;}
.img-card{display:flex;flex-direction:column;align-items:center;gap:5px;}
.sec-img{max-width:240px;max-height:180px;object-fit:contain;border:1px solid #ddd;border-radius:5px;display:block;}
.img-cap{font-size:11px;color:#555;text-align:center;max-width:240px;line-height:1.4;font-weight:500;}
.img-edit-area{background:#f9f9f9;border:1px dashed #ccc;border-radius:6px;padding:12px;margin-top:8px;}
.img-edit-title{font-size:11px;font-weight:700;color:var(--gd);margin-bottom:10px;}
.img-edit-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;padding:8px;background:#fff;border-radius:6px;border:1px solid #e8e8e8;}
.img-thumb{width:90px;height:70px;object-fit:contain;border:1px solid #ddd;border-radius:4px;flex-shrink:0;background:#f5f5f5;}
.img-edit-right{flex:1;display:flex;flex-direction:column;gap:5px;}
.img-cap-input{width:100%;border:1px solid var(--t4);border-radius:4px;padding:6px 8px;font-family:inherit;font-size:12px;}
.btn-del-img{padding:4px 10px;background:#fee;color:var(--or);border:1px solid #fcc;border-radius:4px;font-size:11px;cursor:pointer;}
.btn-replace-img{display:inline-block;padding:4px 10px;background:#f0f0f0;color:var(--t2);border:1px solid #ddd;border-radius:4px;font-size:11px;cursor:pointer;}
.btn-upload-img{display:inline-block;padding:8px 16px;background:var(--gl);color:var(--g);border:1.5px dashed var(--gm);border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px;width:100%;text-align:center;}
.el{flex:1;overflow-y:auto;padding:14px 20px;}
.es{background:#fff;border-radius:var(--r);border:1px solid #dde8e2;margin-bottom:12px;overflow:hidden;}
.esh{display:flex;align-items:center;gap:7px;padding:7px 12px;background:var(--gl);border-bottom:1px solid #dde8e2;}
.esh input{flex:1;border:1px solid transparent;background:transparent;font-family:inherit;font-size:13px;font-weight:700;color:var(--gd);padding:3px 6px;border-radius:4px;}
.esh input:focus{border-color:var(--g);background:#fff;outline:none;}
.bi{width:26px;height:26px;border:none;border-radius:4px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.bd{background:var(--orl);color:var(--or);}.bd:hover{background:var(--or);color:#fff;}
.esb{padding:8px 12px;}
.er{display:flex;align-items:flex-start;gap:6px;margin-bottom:6px;padding:4px;border-radius:4px;background:#f5f5f5;}
.er textarea{flex:1;border:1px solid var(--t4);border-radius:4px;padding:5px 8px;font-family:inherit;font-size:12px;color:var(--t2);line-height:1.65;resize:vertical;min-height:48px;}
.er textarea:focus{border-color:var(--g);outline:none;}
.bdr{background:#fee;color:var(--or);border:none;}.bdr:hover{background:var(--or);color:#fff;}
.btn-ar{width:100%;padding:5px;background:var(--gl);color:var(--g);border:1px dashed var(--gm);border-radius:4px;font-family:inherit;font-size:11px;cursor:pointer;margin-top:3px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--gd);color:#fff;padding:10px 20px;border-radius:7px;font-size:13px;font-weight:500;opacity:0;transform:translateY(6px);transition:all .3s;z-index:1000;pointer-events:none;}.toast.on{opacity:1;transform:translateY(0);}
.menu-btn{display:none;background:none;border:none;color:#fff;font-size:20px;cursor:pointer;padding:4px;}
@media(max-width:600px){  .hdr{height:50px;}  .hdr-title{font-size:13px;}  .tb{padding:4px 8px;font-size:11px;}  .cust-bar{padding:8px 12px;}  .main{height:calc(100vh - 50px - 42px);}  .sb{width:200px;min-width:200px;}  .pv{padding:12px;}  .cov{padding:16px 18px;}  .cov-ttl{font-size:15px;letter-spacing:0.08em;}  .ob{padding:8px 12px;gap:6px;}  .btn-pr,.btn-pd{padding:7px 14px;font-size:12px;}}
@media(max-width:420px){  .sb{display:none;}  .sb.open{display:flex;position:fixed;top:0;left:0;height:100vh;z-index:300;box-shadow:4px 0 20px rgba(0,0,0,0.2);}  .menu-btn{display:flex!important;}}
@media print{  #mainUI{display:none!important;}  #pa{display:block!important;background:#fff!important;padding:0!important;margin:0!important;}  .sc{box-shadow:none!important;border:1px solid #333!important;page-break-inside:avoid;}  .cov{box-shadow:none!important;border:1px solid #333!important;page-break-inside:avoid;}  body{background:#fff!important;color:#000!important;font-size:11pt!important;}}
#pa{display:none;background:#fff;padding:20px 28px;font-family:Meiryo,sans-serif;}
table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 11px; }
th, td { border: 1px solid #333; padding: 6px; text-align: left; }
th { background-color: #e8f4ed; font-weight: bold; }
</style>
</head>
<body>

<div id="mainUI">
  <div class="hdr">
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="menu-btn" id="menuBtn" onclick="toggleSB()">☰</button>
      <div class="hdr-title">タケダ造園 <span>重要事項説明書</span></div>
    </div>
    <div class="hdr-tabs">
      <button class="tb" id="tabS" onclick="switchDoc('service')">🌿 サッパリーズ</button>
      <button class="tb on" id="tabK" onclick="switchDoc('construction')">🏗 Takezo Farm</button>
      <button class="tb" id="tabE" onclick="switchMode('edit')" style="display: none;">✏️ 編集</button>
      <button class="tb" id="adminBtn" onclick="toggleAdminMode()">🔑</button>
    </div>
  </div>

  <div class="cust-bar">
    <label style="color:#0f4526;font-weight:700;" for="custName">お客様名：</label>
    <input class="cust-input" id="custName" type="text" placeholder="例：山田 太郎 様" oninput="updateCustName(this.value)">
    <label style="color:#0f4526;font-weight:700;" for="custDate">日付：</label>
    <input class="date-input" id="custDate" type="date" oninput="updateCustDate(this.value)">
  </div>

  <div class="main">
    <div class="sb" id="sidebar">
      <div class="sb-hd">
        <h2 id="sbTitle">📋 Takezo Farm</h2>
        <div class="sb-acts">
          <button class="btn-all" onclick="checkAll(true)">全ON</button>
          <button class="btn-non" onclick="checkAll(false)">全OFF</button>
        </div>
      </div>
      <div class="cl" id="checklist"></div>
    </div>

    <div class="cnt">
      <div class="pv" id="previewArea">
        <div class="dp" id="docPreview"></div>
      </div>

      <div class="ep" id="editPanel">
        <div class="et">
          <h2 id="editTitle">✏️ 編集</h2>
          <button class="btn-bk" onclick="switchMode('preview')">← 戻る</button>
          <button class="btn-cover-edit" onclick="toggleCoverEdit()">¼ 表紙編集</button>
          <button class="btn-fixed-edit" onclick="toggleFixedEdit()">🔒 固定設定</button>
          <button class="btn-as" onclick="addSection()">＋ 追加</button>
          <button class="btn-sv" onclick="saveAll()">💾 保存</button>
          <button class="btn-reset" onclick="resetData()">🔄 リセット</button>
        </div>

        <div id="fixedEditPanel" style="display:none;background:#f0f8ff;border-bottom:1px solid #b0d0f0;padding:14px 20px;">
          <div style="font-size:12px;font-weight:700;color:#1a4a80;margin-bottom:10px;">🔒 固定項目の設定（常にチェックされる項目）</div>
          <div id="fixedList" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;"></div>
        </div>

        <div id="coverEditPanel" style="display:none;background:#fff8f0;border-bottom:1px solid #ffd580;padding:14px 20px;">
          <div style="font-size:12px;font-weight:700;color:#b07000;margin-bottom:10px;">📝 表紙の編集</div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div>
              <label style="font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:4px;">タイトル</label>
              <input type="text" id="coverTitleInput" style="width:100%;border:1px solid #ddd;border-radius:5px;padding:7px 10px;" oninput="updateCoverData('title', this.value)">
            </div>
            <div>
              <label style="font-size:11px;font-weight:700;color:#555;display:block;margin-bottom:4px;">説明文</label>
              <textarea id="coverIntroInput" rows="3" style="width:100%;border:1px solid #ddd;border-radius:5px;padding:7px 10px;" oninput="updateCoverData('intro', this.value)"></textarea>
            </div>
          </div>
        </div>

        <div class="el" id="editList"></div>
      </div>

      <div class="ob">
        <div class="ob-info" id="selectedCount">選択中: <strong>0</strong> 項目</div>
        <button class="btn-pr" onclick="window.print()">🖨️ 印刷 / PDF出力</button>
      </div>
    </div>
  </div>
</div>

<div id="pa"></div>
<div class="toast" id="toast">設定を保存しました</div>

<script>
// --- 初期マスタデータ定義（GitHubの相対パスに変更） ---
const DEFAULT_DATA = {
  service: {
    cover: {
      title: "お庭のお手入れ 重要事項説明書",
      intro: "このたびはタケダ造園サッパリーズにご用命いただき誠にありがとうございます。作業を円滑かつ安全に進めるため、以下の重要事項についてご確認とご理解をお願いいたします。"
    },
    sections: [
      {
        id: "s1", title: "作業当日のご準備とお願い", fixed: true, checked: true,
        contents: [
          "作業中は水道、外部コンセント（電気）を無償にてお借りいたしますのでご了承ください。",
          "お留守中の作業も可能ですが、戸締まりは確実にお願いいたします。宅内への立ち入りは原則いたしません。",
          "ペットをお飼いの場合は、作業箇所に近づかないよう繋留等のご対応をお願いいたします。"
        ],
        images: []
      },
      {
        id: "s2", title: "雨天時の対応について", fixed: true, checked: true,
        contents: [
          "雨天や強風などの悪天候の場合、安全確保および作業品質維持のため、当日の朝までに延期のご連絡を差し上げることがございます。",
          "天候による順延の場合、予備日または別途ご相談の上、候補日にて再調整させていただきます。"
        ],
        images: []
      }
    ]
  },
  construction: {
    cover: {
      title: "お　庭　工　事　重　要　事　項　説　明　書",
      intro: "このたびは株式会社タケダ造園、Takezo・ファーム、Takezo・和庭にご用命頂きまして、誠に有難うございます。お庭工事を行うにあたり、商品及び工事の性質上、特に注意すべき点についてお伝え致します。内容について十分にご理解の上、ご発注いただきますようお願い致します。"
    },
    sections: [
      {
        id: "c1", title: "フェンス・ブロック塀", fixed: false, checked: false,
        contents: [
          "境界フェンスは隣地境界を目的に設置するものです。外部から圧力がかかるような使用方法（手すり・転落防止柵・布団干し・ボール当て・登り場・木の支柱など）はしないでください。",
          "フェンス上に雨具・洗濯物・布団などを載せたり被せたりしないでください。",
          "アルミ色がブラック・ダークブロンズなど色の濃い種類の場合、移動中や施工中の僅かな摩擦によっての擦り傷が目立ち易くなります。万一目立つ場合は近似色のタッチペンで部分塗装いたしますので、予めご了承ください。",

// --- アプリ状態の初期化 ---
let currentDoc = 'construction';
let appMode = 'preview';
let adminMode = false;
let docData = {};
let custName = "";
let custDate = "";

window.onload = function() {
  loadData();
  initApp();
};

function loadData() {
  const saved = localStorage.getItem('juyo_app_data');
  if (saved) {
    try {
      docData = JSON.parse(saved);
      // 古いデータ形式の救済補完
      if (!docData.service.cover) docData.service.cover = { ...DEFAULT_DATA.service.cover };
      if (!docData.construction.cover) docData.construction.cover = { ...DEFAULT_DATA.construction.cover };
    } catch(e) {
      docData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    }
  } else {
    docData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function initApp() {
  renderChecklist();
  renderPreview();
  renderEditPanel();
  updateSelectedCount();
}

function updateCustName(val) {
  custName = val;
  renderPreview();
}

function updateCustDate(val) {
  custDate = val;
  renderPreview();
}

function switchDoc(docType) {
  currentDoc = docType;
  document.getElementById('tabS').classList.toggle('on', docType === 'service');
  document.getElementById('tabK').classList.toggle('on', docType === 'construction');
  document.getElementById('sbTitle').innerText = docType === 'service' ? '📋 サッパリーズ' : '📋 Takezo Farm';
  initApp();
}

function switchMode(mode) {
  appMode = mode;
  document.getElementById('tabE').classList.toggle('on', mode === 'edit');
  document.getElementById('previewArea').style.display = mode === 'preview' ? 'block' : 'none';
  document.getElementById('editPanel').classList.toggle('on', mode === 'edit');
  if (mode === 'edit') renderEditPanel();
  else renderPreview();
}

function toggleAdminMode() {
  adminMode = !adminMode;
  document.getElementById('adminBtn').classList.toggle('on', adminMode);
  document.getElementById('tabE').style.display = adminMode ? 'block' : 'none';
  if (!adminMode && appMode === 'edit') switchMode('preview');
  initApp();
}

function checkAll(status) {
  docData[currentDoc].sections.forEach(sec => {
    if (!sec.fixed) sec.checked = status;
  });
  initApp();
}

function toggleCheck(index) {
  const sec = docData[currentDoc].sections[index];
  if (sec.fixed) return;
  sec.checked = !sec.checked;
  initApp();
}

function renderChecklist() {
  const listContainer = document.getElementById('checklist');
  listContainer.innerHTML = '';
  docData[currentDoc].sections.forEach((sec, idx) => {
    const item = document.createElement('div');
    item.className = 'ci' + (sec.checked ? ' on' : '') + (sec.fixed ? ' fixed-item' : '');
    item.onclick = () => toggleCheck(idx);
    if (sec.fixed) {
      item.innerHTML = `<span class="fixed-chk">☑</span><label>${sec.title} <span class="lock-icon">🔒</span></label>`;
    } else {
      item.innerHTML = `<input type="checkbox" ${sec.checked ? 'checked' : ''} onclick="event.stopPropagation(); toggleCheck(${idx})"><label>${sec.title}</label>`;
    }
    listContainer.appendChild(item);
  });
}

function renderPreview() {
  const preview = document.getElementById('docPreview');
  preview.innerHTML = '';
  const coverData = docData[currentDoc].cover;

  const cov = document.createElement('div');
  cov.className = 'cov';
  const formattedDate = custDate ? formatDateJa(custDate) : formatDateJa(new Date());
  cov.innerHTML = `
    <div class="cov-meta">
      <div class="cov-name">${custName ? custName + ' 様' : '<span style="color:#bbb;">お客様名を入力してください</span>'}</div>
      <div class="cov-date">説明日：${formattedDate}</div>
    </div>
    <div class="cov-ttl">${coverData.title}</div>
    <div class="cov-txt">${coverData.intro}</div>
  `;

  const toc = document.createElement('div');
  toc.className = 'cov-toc';
  toc.innerHTML = '<div class="cov-toc-title">■ 説明項目</div>';
  const ol = document.createElement('ol');
  ol.className = 'cov-toc-list';

  let hasActiveSection = false;
  let sectionCounter = 1;

  docData[currentDoc].sections.forEach(sec => {
    if (sec.checked) {
      hasActiveSection = true;
      const li = document.createElement('li');
      li.innerText = sec.title;
      ol.appendChild(li);

      const sc = document.createElement('div');
      sc.className = 'sc';
      sc.innerHTML = `<div class="sh"><span class="sh-num">${sectionCounter}.</span> ${sec.title}</div>`;

      const sb2 = document.createElement('div');
      sb2.className = 'sb2';

      let rowCounter = 1;
      sec.contents.forEach(content => {
        if (content.startsWith('HTML_TABLE:')) {
          const tbl = document.createElement('div');
          tbl.style.margin = "10px 0";
          tbl.innerHTML = content.replace('HTML_TABLE:', '');
          sb2.appendChild(tbl);
        } else {
          const cr = document.createElement('div');
          cr.className = 'cr';
          cr.innerHTML = `<span class="cn">${rowCounter}.</span><span class="ct">${content}</span>`;
          sb2.appendChild(cr);
          rowCounter++;
        }
      });

      if (sec.images && sec.images.length > 0) {
        const imgRow = document.createElement('div');
        imgRow.className = 'img-row';
        sec.images.forEach(img => {
          const imgCard = document.createElement('div');
          imgCard.className = 'img-card';
          imgCard.innerHTML = `<img src="${img.src}" class="sec-img" alt="参考画像"><div class="img-cap">${img.caption}</div>`;
          imgRow.appendChild(imgCard);
        });
        sb2.appendChild(imgRow);
      }

      sc.appendChild(sb2);
      preview.appendChild(sc);
      sectionCounter++;
    }
  });

  if (hasActiveSection) {
    toc.appendChild(ol);
    cov.appendChild(toc);
  }
  preview.insertBefore(cov, preview.firstChild);
  document.getElementById('pa').innerHTML = preview.innerHTML;
}

function renderEditPanel() {
  document.getElementById('editTitle').innerText = `✏️ 編集（${currentDoc === 'service' ? 'サッパリーズ' : 'Takezo Farm'}）`;
  document.getElementById('coverTitleInput').value = docData[currentDoc].cover.title;
  document.getElementById('coverIntroInput').value = docData[currentDoc].cover.intro;

  const fixedList = document.getElementById('fixedList');
  fixedList.innerHTML = '';
  docData[currentDoc].sections.forEach((sec, idx) => {
    const tag = document.createElement('span');
    tag.className = 'fixed-tag' + (sec.fixed ? ' fixed-tag-on' : '');
    tag.innerText = (sec.fixed ? '🔒 ' : '') + sec.title;
    tag.onclick = () => {
      sec.fixed = !sec.fixed;
      if (sec.fixed) sec.checked = true;
      renderEditPanel();
      renderChecklist();
    };
    fixedList.appendChild(tag);
  });

  const container = document.getElementById('editList');
  container.innerHTML = '';

  docData[currentDoc].sections.forEach((sec, sIdx) => {
    const es = document.createElement('div');
    es.className = 'es';

    const esh = document.createElement('div');
    esh.className = 'esh';

    const moveBtns = document.createElement('div');
    moveBtns.className = 'move-btns';
    moveBtns.innerHTML = `
      <button class="btn-move" onclick="moveSection(${sIdx}, -1)" ${sIdx === 0 ? 'disabled' : ''}>▲</button>
      <button class="btn-move" onclick="moveSection(${sIdx}, 1)" ${sIdx === docData[currentDoc].sections.length - 1 ? 'disabled' : ''}>▼</button>
    `;

    const input = document.createElement('input');
    input.type = 'text';
    input.value = sec.title;
    input.onchange = (e) => { sec.title = e.target.value; renderChecklist(); };

    const delBtn = document.createElement('button');
    delBtn.className = 'bi bd';
    delBtn.innerText = '🗑';
    delBtn.onclick = () => {
      if (confirm('この項目をまるごと削除しますか？')) {
        docData[currentDoc].sections.splice(sIdx, 1);
        renderEditPanel();
        renderChecklist();
      }
    };

    esh.appendChild(moveBtns);
    esh.appendChild(input);
    esh.appendChild(delBtn);
    es.appendChild(esh);

    const esb = document.createElement('div');
    esb.className = 'esb';

    sec.contents.forEach((content, cIdx) => {
      const er = document.createElement('div');
      er.className = 'er';

      const rMove = document.createElement('div');
      rMove.className = 'move-btns';
      rMove.innerHTML = `
        <button class="btn-move" onclick="moveRow(${sIdx}, ${cIdx}, -1)" ${cIdx === 0 ? 'disabled' : ''}>▲</button>
        <button class="btn-move" onclick="moveRow(${sIdx}, ${cIdx}, 1)" ${cIdx === sec.contents.length - 1 ? 'disabled' : ''}>▼</button>
      `;

      const textarea = document.createElement('textarea');
      textarea.value = content;
      textarea.onchange = (e) => { sec.contents[cIdx] = e.target.value; };

      const rDel = document.createElement('button');
      rDel.className = 'bi bdr';
      rDel.innerText = '🗑';
      rDel.onclick = () => {
        sec.contents.splice(cIdx, 1);
        renderEditPanel();
      };

      er.appendChild(rMove);
      er.appendChild(textarea);
      er.appendChild(rDel);
      esb.appendChild(er);
    });

    const addRowBtn = document.createElement('button');
    addRowBtn.className = 'btn-ar';
    addRowBtn.innerText = '＋ 説明文を追加';
    addRowBtn.onclick = () => {
      sec.contents.push('');
      renderEditPanel();
    };
    esb.appendChild(addRowBtn);

    const imgArea = document.createElement('div');
    imgArea.className = 'img-edit-area';
    imgArea.innerHTML = '<div class="img-edit-title">📷 参考写真</div>';

    if (sec.images && sec.images.length > 0) {
      sec.images.forEach((img, imgIdx) => {
        const row = document.createElement('div');
        row.className = 'img-edit-row';
        row.innerHTML = `
          <img src="${img.src}" class="img-thumb">
          <div class="img-edit-right">
            <input type="text" class="img-cap-input" value="${img.caption}" oninput="docData['${currentDoc}'].sections[${sIdx}].images[${imgIdx}].caption = this.value">
            <div style="display:flex;gap:5px;margin-top:3px;">
              <label class="btn-replace-img">🔄 変更<input type="file" accept="image/*" style="display:none" onchange="uploadImage(${sIdx}, ${imgIdx}, this)"></label>
              <button class="btn-del-img" onclick="deleteImage(${sIdx}, ${imgIdx})">🗑 削除</button>
            </div>
          </div>
        `;
        imgArea.appendChild(row);
      });
    }

    const uploadBtn = document.createElement('label');
    uploadBtn.className = 'btn-upload-img';
    uploadBtn.innerHTML = '＋ 写真を追加<input type="file" accept="image/*" style="display:none" onchange="uploadImage(${sIdx}, null, this)">';
    imgArea.appendChild(uploadBtn);
    esb.appendChild(imgArea);

    es.appendChild(esb);
    container.appendChild(es);
  });
}

function updateCoverData(field, val) {
  docData[currentDoc].cover[field] = val;
}

function addSection() {
  docData[currentDoc].sections.push({
    id: 'new_' + Date.now(), title: '新しい項目', fixed: false, checked: true, contents: [''], images: []
  });
  renderEditPanel();
  renderChecklist();
}

function moveSection(index, direction) {
  const target = index + direction;
  if (target < 0 || target >= docData[currentDoc].sections.length) return;
  const arr = docData[currentDoc].sections;
  [arr[index], arr[target]] = [arr[target], arr[index]];
  renderEditPanel();
  renderChecklist();
}

function moveRow(sIdx, cIdx, direction) {
  const target = cIdx + direction;
  const arr = docData[currentDoc].sections[sIdx].contents;
  if (target < 0 || target >= arr.length) return;
  [arr[cIdx], arr[target]] = [arr[target], arr[cIdx]];
  renderEditPanel();
}

function uploadImage(sIdx, imgIdx, input) {
  if (!input.files || !input.files[0]) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    if (!docData[currentDoc].sections[sIdx].images) docData[currentDoc].sections[sIdx].images = [];
    if (imgIdx === null) {
      docData[currentDoc].sections[sIdx].images.push({ src: e.target.result, caption: '新しい写真' });
    } else {
      docData[currentDoc].sections[sIdx].images[imgIdx].src = e.target.result;
    }
    renderEditPanel();
  };
  reader.readAsDataURL(input.files[0]);
}

function deleteImage(sIdx, imgIdx) {
  docData[currentDoc].sections[sIdx].images.splice(imgIdx, 1);
  renderEditPanel();
}

function updateSelectedCount() {
  const count = docData[currentDoc].sections.filter(s => s.checked).length;
  document.getElementById('selectedCount').innerHTML = `選択中: <strong>${count}</strong> / ${docData[currentDoc].sections.length} 項目`;
}

function saveAll() {
  localStorage.setItem('juyo_app_data', JSON.stringify(docData));
  showToast('設定をブラウザに保存しました');
  renderPreview();
}

function resetData() {
  if (confirm('すべての編集内容を初期状態に戻しますか？（追加した写真や文章はリセットされます）')) {
    localStorage.removeItem('juyo_app_data');
    loadData();
    initApp();
    showToast('初期設定にリセットしました');
  }
}

function toggleSB() { document.getElementById('sidebar').classList.toggle('open'); }
function toggleCoverEdit() { const p = document.getElementById('coverEditPanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }
function toggleFixedEdit() { const p = document.getElementById('fixedEditPanel'); p.style.display = p.style.display === 'none' ? 'block' : 'none'; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.innerText = msg; t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 2500);
}

function formatDateJa(dateStr) {
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return "";
  return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
}
</script>
