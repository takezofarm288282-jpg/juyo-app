<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>重要事項説明書 復元版</title></head>
<body>
<div id="app">復元中...</div>
<script>
window.onload = function() {
  const data = JSON.parse(localStorage.getItem('juyo_v8')); // v8からデータを引き出します
  const app = document.getElementById('app');
  app.innerHTML = "<h1>復元データ</h1>";
  
  // ここに全37項目を表示する処理を入れます
  data.forEach((item, i) => {
    app.innerHTML += `<div>${i+1}. ${item.label}</div>`;
  });
};
</script>
</body>
</html>
