<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タケダ造園 重要事項説明書</title>
<style>
  body { display: flex; font-family: sans-serif; height: 100vh; margin: 0; }
  /* 左側のメニュー（チェックリスト） */
  #sidebar { width: 250px; background: #f8f8f8; border-right: 1px solid #ddd; padding: 20px; overflow-y: auto; }
  /* 右側の詳細エリア */
  #main-content { flex: 1; padding: 40px; overflow-y: auto; }
  .item-section { border: 1px solid #ddd; padding: 20px; margin-bottom: 30px; border-radius: 8px; }
  .item-title { font-weight: bold; color: #1a6b3c; font-size: 1.5em; border-bottom: 2px solid #1a6b3c; margin-bottom: 15px; }
  img { max-width: 400px; display: block; margin-top: 15px; }
</style>
</head>
<body>

  <div id="sidebar">
    <h3>重要事項リスト</h3>
    <div id="checklist"></div>
  </div>

  <div id="main-content">
    <div id="display-area"></div>
  </div>

<script>
// 全項目データを定義
const fullData = [
  { id: "item1", title: "工事中", content: "工事期間中の注意点...", img: "画像57.jpg" },
  { id: "item2", title: "フェンス・ブロック塀", content: "ブロック塀等の説明...", img: "画像14.jpg" }
  // ...ここに全37項目を記述
];

// 初期化：リストと詳細エリアを自動生成
window.onload = function() {
  const checklist = document.getElementById('checklist');
  const display = document.getElementById('display-area');

  fullData.forEach(item => {
    // チェックボックス作成
    const label = document.createElement('label');
    label.innerHTML = `<input type="checkbox" checked onchange="updateView()"> ${item.title}<br>`;
    checklist.appendChild(label);

    // 詳細エリア作成
    const div = document.createElement('div');
    div.id = "view-" + item.id;
    div.className = "item-section";
    div.innerHTML = `<div class="item-title">${item.title}</div><p>${item.content}</p>${item.img ? `<img src="${item.img}">` : ''}`;
    display.appendChild(div);
  });
};

// チェックの有無で表示を切り替える機能
function updateView() {
  // チェックボックスの状態を見て、対応する詳細エリアの表示/非表示を切り替える
}
</script>
</body>
</html>
