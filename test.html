<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タケダ造園 重要事項説明書</title>
<style>
  body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
  .section { border: 2px solid #1a6b3c; padding: 20px; margin-bottom: 20px; border-radius: 10px; }
  .title { font-weight: bold; color: #1a6b3c; font-size: 20px; margin-bottom: 10px; }
</style>
</head>
<body>
  <h1>重要事項説明書（全項目表示）</h1>
  <div id="app"></div>

<script>
// 全項目をここに出力します
const fullData = [
  "工事中", "キャンセルポリシー", "工事完成後の保証", "契約にあたり", 
  "剪定", "薬剤散布", "除草", "整地", "ブロック塀", "コンクリート打設", 
  "カーポート設置", "フェンス設置", "ウッドデッキ", "タイルデッキ", 
  "人工芝", "植栽", "石貼り", "照明設置", "散水栓", "排水工事", 
  "白華現象", "クラック", "レベル調整", "資材搬入", "残土処理", 
  "近隣挨拶", "交通誘導", "作業時間", "現場管理", "安全管理", 
  "アフターフォロー", "損害賠償", "天候不順対応", "追加工事", 
  "支払条件", "図面変更", "近隣トラブル対応"
];

window.onload = function() {
  const app = document.getElementById('app');
  app.innerHTML = "";
  fullData.forEach(item => {
    const div = document.createElement('div');
    div.className = "section";
    div.innerHTML = `<div class="title">${item}</div><p>（説明テキストがここに表示されます）</p>`;
    app.appendChild(div);
  });
};
</script>
</body>
</html>
