<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タケダ造園 重要事項説明書</title>
<style>
  body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
  .section { border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
  .fixed { border-left: 8px solid #d9534f; background: #fff5f5; }
  .title { font-weight: bold; color: #1a6b3c; font-size: 20px; margin-bottom: 10px; }
  .editor-zone { display: none; background: #eee; padding: 20px; margin-top: 30px; }
</style>
</head>
<body>
  <h1>タケダ造園 重要事項説明書</h1>
  <button onclick="enterEdit()">⚙️ 編集モードへ入る（要パスワード）</button>
  <div id="app"></div>

  <div id="editMode" class="editor-zone">
    <h2>編集・管理画面</h2>
    <div id="editorContent"></div>
    <button onclick="saveChanges()">💾 全データを保存</button>
  </div>

<script>
// データと写真紐付け
const DB = {
  fixedItems: ["工事中", "キャンセルポリシー", "工事完成後の保証", "契約にあたり"],
  data: [ /* 全37項目データ */ ]
};

// 1. ページを開いたら即座に表示（閲覧はパスワード不要）
function renderDisplay() {
  const app = document.getElementById('app');
  app.innerHTML = "";
  DB.data.forEach(sec => {
    if (sec.checked || DB.fixedItems.includes(sec.label)) {
      const div = document.createElement('div');
      div.className = `section ${DB.fixedItems.includes(sec.label) ? 'fixed' : ''}`;
      div.innerHTML = `<div class="title">${sec.label}</div>
                       <div class="content">${sec.content}</div>
                       ${sec.img ? `<img src="${sec.img}" style="max-width:300px;">` : ''}`;
      app.appendChild(div);
    }
  });
}

// 2. 編集ボタンを押した時だけパスワード認証
function enterEdit() {
  const pw = prompt("編集用パスワードを入力してください");
  if (pw === "takezo") {
    document.getElementById('editMode').style.display = "block";
    renderEditor();
  } else {
    alert("パスワードが違います");
  }
}

function renderEditor() { /* ここに編集用フォームを描画 */ }
function saveChanges() { alert("保存しました"); }

window.onload = renderDisplay;
</script>
</body>
</html>
