<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>重要事項説明書（完全復元版）</title>
<style>
  body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
  .sc { margin-bottom: 20px; border: 1px solid #ccc; padding: 15px; border-radius: 8px; }
  .sh { font-weight: bold; color: #0f4526; font-size: 18px; margin-bottom: 10px; }
  .ct { white-space: pre-wrap; }
  .sec-img { max-width: 200px; margin: 5px; }
</style>
</head>
<body>
  <div id="app">
    <h3>修復データを読み込み中...</h3>
  </div>

<script>
window.onload = function() {
  const v9 = localStorage.getItem('juyo_v9');
  if (!v9) {
    document.getElementById('app').innerHTML = "データが見つかりませんでした。";
    return;
  }
  
  const parsed = JSON.parse(v9);
  const app = document.getElementById('app');
  app.innerHTML = "<h1>データ復元完了</h1>";

  // データの構造を解析して画面に書き出す
  if (parsed.data && parsed.data.construction) {
    parsed.data.construction.forEach((sec, idx) => {
      if(sec.checked) {
        const div = document.createElement('div');
        div.className = 'sc';
        div.innerHTML = `<div class="sh">${idx + 1}. ${sec.label}</div>`;
        
        sec.content.forEach(c => {
          const p = document.createElement('p');
          p.className = 'ct';
          p.innerText = c.text || c;
          div.appendChild(p);
        });
        app.appendChild(div);
      }
    });
  }
};
</script>
</body>
</html>
