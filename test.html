<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タケダ造園 重要事項説明書</title>
<style>
  body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
  .item-card { border: 2px solid #1a6b3c; padding: 15px; margin-bottom: 20px; border-radius: 8px; }
  .title { font-weight: bold; font-size: 1.2em; color: #1a6b3c; margin-bottom: 10px; }
  .section-container { margin-top: 30px; }
</style>
</head>
<body>
  <h1>タケダ造園 重要事項説明書</h1>
  <div id="full-list" class="section-container"></div>

<script>
// 全37項目を定義した完全リスト
const data = [
  "工事中", "キャンセルポリシー", "工事完成後の保証", "契約にあたり",
  "剪定", "薬剤散布", "除草", "整地", "ブロック塀", "コンクリート打設",
  "カーポート設置", "フェンス設置", "ウッドデッキ", "タイルデッキ",
  "人工芝", "植栽", "石貼り", "照明設置", "散水栓", "排水工事",
  "白華現象", "クラック", "レベル調整", "資材搬入", "残土処理",
  "近隣挨拶", "交通誘導", "作業時間", "現場管理", "安全管理",
  "アフターフォロー", "損害賠償", "天候不順対応", "追加工事",
  "支払条件", "図面変更", "近隣トラブル対応"
];

// ページを開いた瞬間にすべての項目を描画する命令
window.onload = function() {
  const container = document.getElementById('full-list');
  container.innerHTML = "";
  data.forEach(item => {
    const div = document.createElement('div');
    div.className = "item-card";
    div.innerHTML = `<div class="title">${item}</div><p>詳細内容がここに表示されます。</p>`;
    container.appendChild(div);
  });
};
</script>
</body>
</html>
