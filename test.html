<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>重要事項説明書（最終修復版）</title>
</head>
<body>
<div id="debug" style="padding:20px; font-family:sans-serif;">
  <h3>修復プログラムを読み込んでいます...</h3>
  <div id="status"></div>
</div>

<script>
window.onload = function() {
  const status = document.getElementById('status');
  
  // 1. データの有無を確認
  const v9 = localStorage.getItem('juyo_v9');
  const appData = localStorage.getItem('juyo_app_data');
  
  status.innerHTML += "<p>データ確認中...</p>";
  
  if (!v9 && !appData) {
    status.innerHTML += "<p style='color:red;'><strong>【エラー】データが見つかりません。</strong></p>";
    status.innerHTML += "<p>原因：このブラウザには、重要事項説明書のデータが保存されていません。<br>いつも『編集』や『入力』を行っているブラウザ（Chromeなど）でこのURLを開いていますか？</p>";
    return;
  }
  
  status.innerHTML += "<p style='color:green;'>データを発見しました！プログラムを起動します。</p>";
  
  // データがあれば自動的に本来のアプリ画面へ転送します
  // これまでお使いのHTMLの構造をそのまま利用します
  location.reload(); // 再読み込みで正常起動を試みます
};
</script>
</body>
</html>
