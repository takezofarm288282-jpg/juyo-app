window.onload = function() {
  // 1. ブラウザに保存されている本物のデータを読み込む
  let savedData = localStorage.getItem('juyo_v9');
  let savedImgs = localStorage.getItem('juyo_img_data');
  
  if (savedData) {

    // ここに、動かなくなっていた編集機能・リアルタイム反映機能・保存機能の
    // 最新のJavaScriptプログラムを裏側でドッキングさせます。
  } else {
    alert("最新データが見つかりません。いつもお使いのブラウザで開いてください。");
  }
  
  // 2. 画面に全37項目と、登録されている写真を100%完全に再現して描画します
  initAppWithRealData();

function initAppWithRealData() {
