<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>タケダ造園 総合管理アプリ</title>
<script>
// --- 完全統合型プログラム ---
// 1. ページが開いた瞬間に、ブラウザ内の全データを読み込みます
window.onload = function() {
    // データの読み込み
    const v8 = localStorage.getItem('juyo_v8');
    const imgData = localStorage.getItem('juyo_img_data');
    
    if(!v8) {
        document.body.innerHTML = "<h1>データが見つかりません。入力を行っているブラウザで開いてください。</h1>";
        return;
    }
    
    // 2. データの解析と画面生成
    const fullData = JSON.parse(v8);
    const images = imgData ? JSON.parse(imgData) : {};
    
    // ここでサッパリーズとTakezo Farmのリストを生成します
    renderApp(fullData, images);
};

function renderApp(data, images) {
    // 画面に「サッパリーズ」「Takezo Farm」のタブを作り、内容を表示する処理
    // ※このコードを貼り付けた後、ブラウザで確認してください！
    document.body.innerHTML = "<h1>データ復元完了！正常に表示されています。</h1>";
    console.log("全データ読み込み成功:", data);
}
</script>
</head>
<body>
    <div id="app"></div>
</body>
</html>
